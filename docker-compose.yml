version: "3.9"

services:
  product_api:
    image: b2b-product-api:local
    build:
      context: .
      dockerfile: services/product_api/Dockerfile
    ports:
      - "8000:8000"
    environment: &product_api_environment
      APP_ENV: dev
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      GATEWAY_URL: http://gateway_api:8001
      GATEWAY_SHARED_SECRET: dev-shared-secret
      AUTH_TOKEN_SECRET: dev-auth-secret
      AUTH_TOKEN_TTL_SECONDS: "900"
      CLAIM_EDIT_TOKEN_SECRET: dev-claim-edit-secret
      CLAIMS_PRICE_RUB: "990"
      CLAIMS_UPLOAD_DIR: /var/lib/product_api/claims_uploads
      CLAIMS_MAX_FILE_SIZE_BYTES: "10485760"
      CLAIMS_ALLOWED_UPLOAD_MIME_TYPES: '["application/pdf","image/jpeg","image/png","application/vnd.openxmlformats-officedocument.wordprocessingml.document","application/msword","text/plain"]'
      CLAIMS_ADMIN_EMAILS: '["claims-admin@example.com"]'
      INVITE_TOKEN_SECRET: dev-invite-secret
      SESSION_SECRET: dev-session-secret
      SESSION_TTL_SECONDS: "1209600"
      SESSION_COOKIE_NAME: session
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      EMAIL_FROM: no-reply@example.com
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_USE_TLS: "true"
      APP_BASE_URL: http://localhost:8000
      INVITE_TTL_SECONDS: "604800"
      CHAT_CONTEXT_LIMIT: "20"
      GATEWAY_TIMEOUT_SECONDS: "30"
      MAX_MESSAGE_CHARS: "4000"
      RATE_LIMIT_COMPANY_RPM: "60"
      RATE_LIMIT_USER_RPM: "30"
      RATE_LIMIT_IP_RPM: "120"
      DATANEWTON_ENABLED: ${DATANEWTON_ENABLED:-false}
      DATANEWTON_BASE_URL: ${DATANEWTON_BASE_URL:-https://api.datanewton.ru}
      DATANEWTON_API_KEY: ${DATANEWTON_API_KEY:-}
      DATANEWTON_TIMEOUT_SECONDS: ${DATANEWTON_TIMEOUT_SECONDS:-10}
      DATANEWTON_RETRY_COUNT: ${DATANEWTON_RETRY_COUNT:-1}
      DATANEWTON_COUNTERPARTY_FILTERS: ${DATANEWTON_COUNTERPARTY_FILTERS:-MANAGER_BLOCK,ADDRESS_BLOCK}
      DATANEWTON_CACHE_TTL_SECONDS: ${DATANEWTON_CACHE_TTL_SECONDS:-300}
      COMPANY_REPORT_WORKER_POLL_INTERVAL_SECONDS: ${COMPANY_REPORT_WORKER_POLL_INTERVAL_SECONDS:-1}
      COMPANY_REPORT_WORKER_LEASE_SECONDS: ${COMPANY_REPORT_WORKER_LEASE_SECONDS:-60}
      COMPANY_REPORT_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${COMPANY_REPORT_WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
      COMPANY_REPORT_WORKER_SHUTDOWN_GRACE_SECONDS: ${COMPANY_REPORT_WORKER_SHUTDOWN_GRACE_SECONDS:-30}
      COMPANY_CARD_V2_PRESENTATIONS_ENABLED: ${COMPANY_CARD_V2_PRESENTATIONS_ENABLED:-false}
      COMPANY_CARD_V2_WRITER_ENABLED: ${COMPANY_CARD_V2_WRITER_ENABLED:-false}
      COMPANY_CARD_V2_ROLLOUT_GENERATION: ${COMPANY_CARD_V2_ROLLOUT_GENERATION:-0}
      COMPANY_CARD_V2_ALLOWLIST_INNS: ${COMPANY_CARD_V2_ALLOWLIST_INNS:-}
      COMPANY_CARD_V2_PERCENTAGE_BASIS_POINTS: ${COMPANY_CARD_V2_PERCENTAGE_BASIS_POINTS:-0}
      COMPANY_CARD_AI_NARRATIVE_ENABLED: ${COMPANY_CARD_AI_NARRATIVE_ENABLED:-false}
      COMPANY_CARD_AI_NARRATIVE_KILL_SWITCH: ${COMPANY_CARD_AI_NARRATIVE_KILL_SWITCH:-true}
      COMPANY_CARD_AI_NARRATIVE_DAILY_DISPATCH_CREDITS: ${COMPANY_CARD_AI_NARRATIVE_DAILY_DISPATCH_CREDITS:-0}
      COMPANY_CARD_AI_NARRATIVE_MONTHLY_DISPATCH_CREDITS: ${COMPANY_CARD_AI_NARRATIVE_MONTHLY_DISPATCH_CREDITS:-0}
      COMPANY_CARD_AI_NARRATIVE_WORKER_CONCURRENCY: ${COMPANY_CARD_AI_NARRATIVE_WORKER_CONCURRENCY:-0}
      COMPANY_CARD_AI_NARRATIVE_GATEWAY_TIMEOUT_SECONDS: ${COMPANY_CARD_AI_NARRATIVE_GATEWAY_TIMEOUT_SECONDS:-20}
      COMPANY_CARD_AI_NARRATIVE_MAX_OUTPUT_TOKENS: ${COMPANY_CARD_AI_NARRATIVE_MAX_OUTPUT_TOKENS:-600}
    volumes:
      - claims_uploads:/var/lib/product_api/claims_uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net
      - db_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  company_report_worker:
    image: b2b-product-api:local
    command:
      - python
      - -m
      - product_api.company_reports.worker
    restart: unless-stopped
    stop_grace_period: 40s
    environment: *product_api_environment
    volumes:
      - claims_uploads:/var/lib/product_api/claims_uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net
      - db_net

  company_card_narrative_worker:
    image: b2b-product-api:local
    profiles:
      - company-card-narrative
    command:
      - python
      - -m
      - product_api.company_reports.company_card_v2.narrative.worker
    restart: unless-stopped
    stop_grace_period: 40s
    environment: *product_api_environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net
      - db_net

  gateway_api:
    build:
      context: .
      dockerfile: services/gateway_api/Dockerfile
    ports:
      - "8001:8001"
    environment:
      APP_ENV: dev
      LOG_LEVEL: INFO
      GATEWAY_SHARED_SECRET: dev-shared-secret
      GATEWAY_CLOCK_SKEW_SECONDS: "60"
      GATEWAY_NONCE_TTL_SECONDS: "300"
      OPENAI_TIMEOUT_SECONDS: "30"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      COMPANY_CARD_NARRATIVE_GATEWAY_ENABLED: ${COMPANY_CARD_NARRATIVE_GATEWAY_ENABLED:-false}
      COMPANY_CARD_NARRATIVE_MODEL_PROFILE: ${COMPANY_CARD_NARRATIVE_MODEL_PROFILE:-company_card_narrative_structured_v1}
      COMPANY_CARD_NARRATIVE_MODEL: ${COMPANY_CARD_NARRATIVE_MODEL:-}
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  claims_uploads:
  pg_data:

networks:
  app_net:
  db_net:

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http:&#47;&#47;www.w3.org/2000/svg"
     viewBox="0 0 1024 4120"
     width="1024"
     height="4120"
     role="img"
     aria-labelledby="tablet-title tablet-desc">
  <title id="tablet-title">Company Card v2 — tablet contract wireframe</title>
  <desc id="tablet-desc">Tablet handoff at 1024 pixels. A single content column presents identity, deterministic narrative, anchor navigation, requisites, F1 through F5, A1 through A5, sources, limitations and actions. A horizontal fixed bottom call to action contains only its heading and button, with an in-flow inert reserver and safe-area annotation. Synthetic callouts cover long, missing, partial, signed, large-set, focus and non-overlap states.</desc>
  <defs>
    <pattern id="tablet-neutral-pattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#E5E7EB"/>
      <path d="M0 12 L12 0" stroke="#9CA3AF" stroke-width="2"/>
    </pattern>
    <style>
      .bg { fill: #F3F4F6; }
      .card { fill: #FFFFFF; stroke: #9CA3AF; stroke-width: 2; }
      .subcard { fill: #F9FAFB; stroke: #D1D5DB; stroke-width: 1.5; }
      .dash { fill: #F9FAFB; stroke: #6B7280; stroke-width: 2; stroke-dasharray: 8 6; }
      .ink { fill: #111827; font-family: Arial, sans-serif; }
      .muted { fill: #4B5563; font-family: Arial, sans-serif; }
      .h1 { font-size: 28px; font-weight: 700; }
      .h2 { font-size: 21px; font-weight: 700; }
      .h3 { font-size: 17px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: .35px; }
      .line { stroke: #6B7280; stroke-width: 3; fill: none; }
      .thin { stroke: #9CA3AF; stroke-width: 2; fill: none; }
      .zero { stroke: #111827; stroke-width: 2; stroke-dasharray: 5 4; }
      .bar { fill: url(#tablet-neutral-pattern); stroke: #6B7280; stroke-width: 1.5; }
      .plainbar { fill: #D1D5DB; stroke: #6B7280; stroke-width: 1.5; }
      .cta { fill: #EE5A2A; stroke: #111827; stroke-width: 1.5; }
      .ctaText { fill: #111827; font-family: Arial, sans-serif; font-weight: 700; }
      .focusOuter { fill: none; stroke: #111827; stroke-width: 3; }
      .focusInner { fill: none; stroke: #FFFFFF; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1024" height="4120"/>
  <text class="ink label" x="64" y="28">TABLET 1024 • one content column • fixed horizontal CTA + inert in-flow reserver</text>

  <g id="tablet-hero-status">
    <rect class="card" x="64" y="44" width="896" height="190" rx="16"/>
    <text class="ink h1" x="90" y="86">Синтетическая организация с очень длинным</text>
    <text class="ink h1" x="90" y="120">наименованием для проверки переноса</text>
    <text class="muted small" x="90" y="148">LONG • no clipping • full accessible text remains available</text>
    <rect class="subcard" x="90" y="166" width="390" height="44" rx="9"/>
    <rect class="subcard" x="500" y="166" width="434" height="44" rx="9"/>
    <text class="ink small" x="106" y="193">Статус: только verified dated wording</text>
    <text class="ink small" x="516" y="193">Дата отчёта: immutable Moscow snapshot date</text>
  </g>

  <g id="tablet-narrative">
    <rect class="card" x="64" y="254" width="896" height="160" rx="16"/>
    <text class="ink h2" x="90" y="290">Описание компании</text>
    <text class="muted body" x="90" y="320">Universal immutable fallback if AI artifact is unavailable.</text>
    <text class="muted body" x="90" y="348">Only verified public facts and limitations; exact values come from Chart Facts.</text>
    <rect class="subcard" x="90" y="366" width="844" height="26" rx="8"/>
    <text class="ink small" x="106" y="384">Universal immutable fallback • fallback_profile_any_v1 • exact 691 Unicode scalars</text>
  </g>

  <g id="tablet-in-page-navigation">
    <rect class="card" x="64" y="434" width="896" height="84" rx="16"/>
    <text class="ink h3" x="90" y="466">Навигация по странице</text>
    <rect class="subcard" x="90" y="480" width="142" height="24" rx="8"/>
    <rect class="subcard" x="244" y="480" width="142" height="24" rx="8"/>
    <rect class="subcard" x="398" y="480" width="142" height="24" rx="8"/>
    <text class="ink small" x="122" y="497">Реквизиты</text>
    <text class="ink small" x="284" y="497">Финансы</text>
    <text class="ink small" x="436" y="497">Арбитраж</text>
    <text class="muted small" x="568" y="497">FOCUS/TOUCH • anchors, not hidden tabs</text>
  </g>

  <g id="tablet-requisites">
    <rect class="card" x="64" y="538" width="896" height="210" rx="16"/>
    <text class="ink h2" x="90" y="574">Реквизиты</text>
    <rect class="subcard" x="90" y="596" width="404" height="126" rx="10"/>
    <rect class="subcard" x="514" y="596" width="420" height="126" rx="10"/>
    <text class="ink body" x="108" y="624">Safe identity composition</text>
    <text class="muted small" x="108" y="650">Синтетический длинный адрес переносится,</text>
    <text class="muted small" x="108" y="672">не попадает в AI/telemetry и не обрезается.</text>
    <text class="muted small" x="108" y="698">Managers/owners: approved subset only</text>
    <text class="ink body" x="532" y="624">Evidence-gated fields</text>
    <text class="muted small" x="532" y="650">EMPTY/MISSING • — ≠ 0</text>
    <text class="muted small" x="532" y="672">gate_closed stays visible as a limitation</text>
    <text class="muted small" x="532" y="698">No inferred status, unit or legal form</text>
  </g>

  <g id="tablet-finance-f1">
    <rect class="card" x="64" y="768" width="896" height="240" rx="16"/>
    <text class="ink h2" x="90" y="806">F1 · Хватит ли средств на ближайшие обязательства?</text>
    <text class="muted small" x="90" y="834">Latest complete common year • exact Decimal • visible summary and table fallback</text>
    <line class="zero" x1="110" y1="912" x2="658" y2="912"/>
    <rect class="bar" x="142" y="872" width="132" height="40"/>
    <rect class="plainbar" x="274" y="886" width="96" height="26"/>
    <rect class="bar" x="370" y="856" width="164" height="56"/>
    <rect class="plainbar" x="534" y="912" width="98" height="44"/>
    <rect class="subcard" x="688" y="850" width="246" height="120" rx="10"/>
    <text class="ink small" x="706" y="878">Text + exact table</text>
    <text class="muted small" x="706" y="904">pattern plus labels</text>
    <text class="muted small" x="706" y="930">zero baseline shown</text>
    <text class="muted small" x="706" y="956">no tooltip-only fact</text>
  </g>

  <g id="tablet-finance-f2">
    <rect class="card" x="64" y="1028" width="896" height="240" rx="16"/>
    <text class="ink h2" x="90" y="1066">F2 · Как финансируется бизнес?</text>
    <text class="muted small" x="90" y="1094">Seven consecutive years • gaps and denominator state stay explicit</text>
    <line class="zero" x1="370" y1="1120" x2="370" y2="1238"/>
    <rect class="bar" x="224" y="1134" width="146" height="24"/>
    <rect class="plainbar" x="370" y="1134" width="192" height="24"/>
    <rect class="plainbar" x="292" y="1172" width="78" height="24"/>
    <rect class="bar" x="370" y="1172" width="116" height="24"/>
    <rect class="dash" x="248" y="1210" width="238" height="24" rx="6"/>
    <text class="ink label" x="600" y="1140">NEGATIVE/MIXED SIGN/ZERO DENOMINATOR</text>
    <text class="muted small" x="600" y="1168">diverging around zero</text>
    <text class="muted small" x="600" y="1194">no ratio when denominator ≤ 0</text>
    <text class="muted small" x="600" y="1220">gap is not explicit zero</text>
  </g>

  <g id="tablet-finance-f3">
    <rect class="card" x="64" y="1288" width="896" height="240" rx="16"/>
    <text class="ink h2" x="90" y="1326">F3 · Как менялись выручка и активы?</text>
    <text class="muted small" x="90" y="1354">Calendar gaps break lines; each series has independent endpoints.</text>
    <polyline class="line" points="110,1462 190,1426 270,1448"/>
    <rect class="dash" x="292" y="1394" width="112" height="78" rx="8"/>
    <polyline class="line" points="426,1440 506,1408 586,1434 666,1392"/>
    <text class="ink label" x="316" y="1438">MISSING</text>
    <text class="muted small" x="704" y="1408">EMPTY/MISSING distinct</text>
    <text class="muted small" x="704" y="1434">no line through gap</text>
    <text class="muted small" x="704" y="1460">same keyboard text</text>
  </g>

  <g id="tablet-finance-f4">
    <rect class="card" x="64" y="1548" width="896" height="240" rx="16"/>
    <text class="ink h2" x="90" y="1586">F4 · Что остаётся с каждых 100 единиц выручки?</text>
    <text class="muted small" x="90" y="1614">Per-100 ratios only for strictly positive revenue.</text>
    <line class="zero" x1="110" y1="1694" x2="610" y2="1694"/>
    <rect class="plainbar" x="150" y="1648" width="74" height="46"/>
    <rect class="bar" x="270" y="1666" width="74" height="28"/>
    <rect class="plainbar" x="390" y="1694" width="74" height="38"/>
    <rect class="bar" x="510" y="1680" width="74" height="14"/>
    <text class="ink label" x="648" y="1658">SIGNED / ZERO STATE</text>
    <text class="muted small" x="648" y="1686">negative is preserved</text>
    <text class="muted small" x="648" y="1712">unavailable denominator → limitation</text>
    <text class="muted small" x="648" y="1738">neutral patterns, not verdict colors</text>
  </g>

  <g id="tablet-finance-f5">
    <rect class="card" x="64" y="1808" width="896" height="240" rx="16"/>
    <text class="ink h2" x="90" y="1846">F5 · Финансовые показатели по годам</text>
    <text class="muted small" x="90" y="1874">Fixed 9 × 7 table • backend display strings • local overflow only</text>
    <rect class="subcard" x="90" y="1896" width="844" height="124" rx="10"/>
    <line class="thin" x1="282" y1="1896" x2="282" y2="2020"/>
    <line class="thin" x1="90" y1="1927" x2="934" y2="1927"/>
    <line class="thin" x1="90" y1="1958" x2="934" y2="1958"/>
    <line class="thin" x1="90" y1="1989" x2="934" y2="1989"/>
    <text class="ink small" x="108" y="1918">Метрика</text>
    <text class="muted small" x="304" y="1918">seven calendar periods →</text>
    <text class="muted small" x="108" y="1950">Exact/compact</text>
    <text class="muted small" x="108" y="1981">Explicit zero</text>
    <text class="muted small" x="108" y="2012">Missing = —</text>
    <text class="ink label" x="648" y="2012">LOCAL TABLE SCROLL</text>
  </g>

  <g id="tablet-arbitration-a1">
    <rect class="card" x="64" y="2068" width="896" height="240" rx="16"/>
    <text class="ink h2" x="90" y="2106">A1 · Активность по годам и ролям</text>
    <text class="muted small" x="90" y="2134">Bounded observed calendar; unknown year remains separate.</text>
    <rect class="plainbar" x="116" y="2222" width="44" height="54"/>
    <rect class="bar" x="174" y="2192" width="44" height="84"/>
    <rect class="plainbar" x="232" y="2234" width="44" height="42"/>
    <rect class="bar" x="290" y="2176" width="44" height="100"/>
    <rect class="dash" x="350" y="2222" width="72" height="54" rx="7"/>
    <text class="ink label" x="470" y="2188">PARTIAL returned/total</text>
    <text class="muted small" x="470" y="2216">returned N / total M is visible</text>
    <text class="muted small" x="470" y="2242">partial never means “no cases”</text>
    <text class="muted small" x="470" y="2268">role details capped and accessible</text>
  </g>

  <g id="tablet-arbitration-a2">
    <rect class="card" x="64" y="2328" width="896" height="240" rx="16"/>
    <text class="ink h2" x="90" y="2366">A2 · Роли компании</text>
    <text class="muted small" x="90" y="2394">Four categories; exact attribution; no percent on zero denominator.</text>
    <rect class="bar" x="110" y="2426" width="390" height="26"/>
    <rect class="plainbar" x="110" y="2464" width="258" height="26"/>
    <rect class="bar" x="110" y="2502" width="112" height="26"/>
    <rect class="plainbar" x="110" y="2540" width="58" height="18"/>
    <text class="ink small" x="540" y="2446">Истец • exact count</text>
    <text class="muted small" x="540" y="2484">Ответчик • pattern + label</text>
    <text class="muted small" x="540" y="2522">Другая роль • disclosed</text>
    <text class="muted small" x="540" y="2552">Не атрибутировано</text>
  </g>

  <g id="tablet-arbitration-a3">
    <rect class="card" x="64" y="2588" width="896" height="240" rx="16"/>
    <text class="ink h2" x="90" y="2626">A3 · Исходы</text>
    <text class="muted small" x="90" y="2654">Source-bound outcome categories; unknown remains explicit.</text>
    <circle cx="224" cy="2740" r="62" fill="none" stroke="#D1D5DB" stroke-width="30"/>
    <path d="M224 2678 A62 62 0 0 1 282 2760" fill="none" stroke="url(#tablet-neutral-pattern)" stroke-width="30"/>
    <line class="thin" x1="330" y1="2688" x2="470" y2="2688"/>
    <line class="thin" x1="330" y1="2724" x2="520" y2="2724"/>
    <line class="thin" x1="330" y1="2760" x2="450" y2="2760"/>
    <line class="thin" x1="330" y1="2796" x2="404" y2="2796"/>
    <text class="ink label" x="566" y="2708">ACCESSIBLE TEXT ALTERNATIVE</text>
    <text class="muted small" x="566" y="2736">counts and details in DOM</text>
    <text class="muted small" x="566" y="2762">not color-only</text>
    <text class="muted small" x="566" y="2788">no verdict/probability</text>
  </g>

  <g id="tablet-arbitration-a4">
    <rect class="card" x="64" y="2848" width="896" height="240" rx="16"/>
    <text class="ink h2" x="90" y="2886">A4 · Суммы дел по валютам</text>
    <text class="muted small" x="90" y="2914">Exact source currencies remain separate; no FX.</text>
    <line class="zero" x1="330" y1="2944" x2="330" y2="3058"/>
    <rect class="bar" x="202" y="2958" width="128" height="26"/>
    <rect class="plainbar" x="330" y="2958" width="220" height="26"/>
    <rect class="plainbar" x="276" y="2998" width="54" height="26"/>
    <rect class="bar" x="330" y="2998" width="144" height="26"/>
    <rect class="dash" x="202" y="3038" width="272" height="22" rx="6"/>
    <text class="ink label" x="590" y="2968">ZERO / NEGATIVE / MISSING</text>
    <text class="muted small" x="590" y="2996">missing is not zero</text>
    <text class="muted small" x="590" y="3022">amount is not called debt</text>
    <text class="muted small" x="590" y="3048">details cap = 20</text>
  </g>

  <g id="tablet-arbitration-a5">
    <rect class="card" x="64" y="3108" width="896" height="240" rx="16"/>
    <text class="ink h2" x="90" y="3146">A5 · Частые оппоненты</text>
    <text class="muted small" x="90" y="3174">Safe aliases and masked report-scoped ordinals only.</text>
    <rect class="subcard" x="90" y="3196" width="844" height="124" rx="10"/>
    <text class="ink small" x="108" y="3224">Юридическое лицо A • safe normalized alias</text>
    <text class="ink small" x="108" y="3254">Физическое лицо N • deterministic masked ordinal</text>
    <text class="ink small" x="108" y="3284">Сторона скрыта N • unknown/conflict</text>
    <text class="ink label" x="572" y="3224">LARGE-N shown N/M</text>
    <text class="muted small" x="572" y="3254">показано N из M • eligible M</text>
    <text class="muted small" x="572" y="3284">LONG wraps; no name grouping</text>
    <text class="muted small" x="572" y="3310">same accessible detail text</text>
  </g>

  <g id="tablet-sources-limitations">
    <rect class="card" x="64" y="3368" width="896" height="210" rx="16"/>
    <text class="ink h2" x="90" y="3406">Источники и ограничения</text>
    <rect class="subcard" x="90" y="3428" width="404" height="124" rx="10"/>
    <rect class="subcard" x="514" y="3428" width="420" height="124" rx="10"/>
    <text class="ink body" x="108" y="3456">Источники</text>
    <text class="muted small" x="108" y="3482">counterparty → finance → arbitration</text>
    <text class="muted small" x="108" y="3508">date/scope/provenance stay separate</text>
    <text class="muted small" x="108" y="3534">no hidden/raw state</text>
    <text class="ink body" x="532" y="3456">Ограничения</text>
    <text class="muted small" x="532" y="3482">gate_closed / partial / missing</text>
    <text class="muted small" x="532" y="3508">provider semantics never guessed</text>
    <text class="muted small" x="532" y="3534">FOCUS/TOUCH same bounded details</text>
  </g>

  <g id="tablet-neutral-actions">
    <rect class="card" x="64" y="3598" width="896" height="140" rx="16"/>
    <text class="ink h2" x="90" y="3634">Действия</text>
    <rect class="subcard" x="90" y="3654" width="326" height="58" rx="10"/>
    <rect class="subcard" x="436" y="3654" width="326" height="58" rx="10"/>
    <text class="ink body" x="138" y="3690">Проверить другую компанию</text>
    <text class="ink body" x="504" y="3690">Подготовить претензию</text>
    <text class="muted small" x="790" y="3678">Exact report</text>
    <text class="muted small" x="790" y="3700">No auto-create</text>
  </g>

  <g id="tablet-cta-reserver">
    <rect class="dash" x="64" y="3758" width="896" height="162" rx="16"/>
    <text class="ink h3" x="90" y="3794">In-flow reserver — aria-hidden + inert, no focusable link</text>
    <text class="muted body" x="90" y="3824">NO OVERLAP • same responsive height as fixed bar under wrapping and 200% zoom</text>
    <text class="muted body" x="90" y="3852">Safe-area + content reserve are server-rendered; hydration may verify, not create correctness.</text>
    <text class="ink label" x="90" y="3884">LOCAL TABLE SCROLL • NO PAGE-WIDE HORIZONTAL OVERFLOW</text>
  </g>

  <g id="tablet-primary-cta">
    <rect x="0" y="3940" width="1024" height="154" fill="#FFFFFF" stroke="#111827" stroke-width="3"/>
    <text class="ink label" x="30" y="3968">FIXED BOTTOM TABLET BAR • 768–1199 • SAFE-AREA / RESERVER</text>
    <text class="ink h2" x="42" y="4028">Вам задолжали?</text>
    <rect class="focusOuter" x="626" y="3984" width="344" height="74" rx="12"/>
    <rect class="focusInner" x="630" y="3988" width="336" height="66" rx="10"/>
    <rect class="cta" x="634" y="3992" width="328" height="58" rx="8"/>
    <text class="ctaText body" x="721" y="4028">Создать претензию</text>
    <text class="muted small" x="42" y="4062">FOCUS/TOUCH • heading + button only; desktop paragraph intentionally omitted</text>
    <text class="ink label" x="812" y="4082">#EE5A2A + DARK TEXT</text>
  </g>

  <text class="muted small" x="64" y="4110">Wireframe only • final palette, typography and chart art belong to later iterations.</text>
</svg>

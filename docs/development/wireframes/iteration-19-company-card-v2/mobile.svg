<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http:&#47;&#47;www.w3.org/2000/svg"
     viewBox="0 0 390 4800"
     width="390"
     height="4800"
     role="img"
     aria-labelledby="mobile-title mobile-desc">
  <title id="mobile-title">Company Card v2 — mobile contract wireframe</title>
  <desc id="mobile-desc">Mobile handoff at 390 pixels. All factual regions are stacked without page-wide horizontal overflow: identity, deterministic narrative, anchor navigation, requisites, F1 through F5, A1 through A5, sources, limitations and actions. Finance table overflow is local. A stacked fixed bottom call to action has an in-flow inert reserver and safe-area annotation. Synthetic callouts cover long, missing, partial, signed, large-set, focus and non-overlap states.</desc>
  <defs>
    <pattern id="mobile-neutral-pattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#E5E7EB"/>
      <path d="M0 10 L10 0" stroke="#9CA3AF" stroke-width="1.5"/>
    </pattern>
    <clipPath id="mobile-table-clip">
      <rect x="34" y="2104" width="322" height="146" rx="9"/>
    </clipPath>
    <style>
      .bg { fill: #F3F4F6; }
      .card { fill: #FFFFFF; stroke: #9CA3AF; stroke-width: 1.5; }
      .subcard { fill: #F9FAFB; stroke: #D1D5DB; stroke-width: 1.2; }
      .dash { fill: #F9FAFB; stroke: #6B7280; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .ink { fill: #111827; font-family: Arial, sans-serif; }
      .muted { fill: #4B5563; font-family: Arial, sans-serif; }
      .h1 { font-size: 21px; font-weight: 700; }
      .h2 { font-size: 17px; font-weight: 700; }
      .h3 { font-size: 15px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 12px; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: .2px; }
      .line { stroke: #6B7280; stroke-width: 2.5; fill: none; }
      .thin { stroke: #9CA3AF; stroke-width: 1.5; fill: none; }
      .zero { stroke: #111827; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .bar { fill: url(#mobile-neutral-pattern); stroke: #6B7280; stroke-width: 1.2; }
      .plainbar { fill: #D1D5DB; stroke: #6B7280; stroke-width: 1.2; }
      .cta { fill: #EE5A2A; stroke: #111827; stroke-width: 1.5; }
      .ctaText { fill: #111827; font-family: Arial, sans-serif; font-weight: 700; }
      .focusOuter { fill: none; stroke: #111827; stroke-width: 3; }
      .focusInner { fill: none; stroke: #FFFFFF; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="390" height="4800"/>
  <text class="ink label" x="16" y="26">MOBILE 390 • stacked • synthetic handoff</text>

  <g id="mobile-hero-status">
    <rect class="card" x="16" y="42" width="358" height="216" rx="14"/>
    <text class="ink h1" x="34" y="76">Синтетическая организация</text>
    <text class="ink h1" x="34" y="104">с очень длинным названием</text>
    <text class="ink h1" x="34" y="132">для проверки переноса</text>
    <text class="muted small" x="34" y="158">LONG • wrap anywhere • no clipping</text>
    <rect class="subcard" x="34" y="176" width="322" height="30" rx="8"/>
    <text class="ink small" x="46" y="196">Статус: только verified dated wording</text>
    <rect class="subcard" x="34" y="214" width="322" height="28" rx="8"/>
    <text class="ink small" x="46" y="233">Дата отчёта: immutable snapshot date</text>
  </g>

  <g id="mobile-narrative">
    <rect class="card" x="16" y="274" width="358" height="178" rx="14"/>
    <text class="ink h2" x="34" y="308">Описание компании</text>
    <text class="muted small" x="34" y="334" textLength="322" lengthAdjust="spacingAndGlyphs">Universal immutable fallback • fallback_profile_any_v1 • exact 691 Unicode scalars</text>
    <text class="muted small" x="34" y="354">Only verified facts and limitations.</text>
    <text class="muted small" x="34" y="380">No score, verdict, advice or hidden values.</text>
    <rect class="subcard" x="34" y="398" width="322" height="34" rx="8"/>
    <text class="ink small" x="46" y="420">0–2 comments • immutable binding</text>
  </g>

  <g id="mobile-in-page-navigation">
    <rect class="card" x="16" y="468" width="358" height="140" rx="14"/>
    <text class="ink h3" x="34" y="498">Навигация по странице</text>
    <rect class="subcard" x="34" y="516" width="94" height="32" rx="8"/>
    <rect class="subcard" x="138" y="516" width="94" height="32" rx="8"/>
    <rect class="subcard" x="242" y="516" width="114" height="32" rx="8"/>
    <text class="ink small" x="49" y="537">Реквизиты</text>
    <text class="ink small" x="160" y="537">Финансы</text>
    <text class="ink small" x="270" y="537">Арбитраж</text>
    <text class="muted small" x="34" y="578">FOCUS/TOUCH • anchors; all SSR content visible</text>
  </g>

  <g id="mobile-requisites">
    <rect class="card" x="16" y="624" width="358" height="220" rx="14"/>
    <text class="ink h2" x="34" y="658">Реквизиты</text>
    <rect class="subcard" x="34" y="676" width="322" height="72" rx="9"/>
    <text class="ink small" x="48" y="700">Синтетический длинный адрес переносится,</text>
    <text class="muted small" x="48" y="722">не обрезается и не попадает в telemetry.</text>
    <rect class="subcard" x="34" y="760" width="322" height="66" rx="9"/>
    <text class="ink small" x="48" y="784">EMPTY/MISSING • — is not zero</text>
    <text class="muted small" x="48" y="806">Gate closed → limitation, not inferred fact</text>
  </g>

  <g id="mobile-finance-f1">
    <rect class="card" x="16" y="860" width="358" height="270" rx="14"/>
    <text class="ink h2" x="34" y="894">F1 · Хватит ли средств</text>
    <text class="ink h2" x="34" y="916">на ближайшие обязательства?</text>
    <text class="muted small" x="34" y="940">Latest complete year • exact Decimal</text>
    <line class="zero" x1="42" y1="1000" x2="348" y2="1000"/>
    <rect class="bar" x="54" y="966" width="74" height="34"/>
    <rect class="plainbar" x="128" y="978" width="54" height="22"/>
    <rect class="bar" x="182" y="952" width="98" height="48"/>
    <rect class="plainbar" x="280" y="1000" width="52" height="34"/>
    <rect class="subcard" x="34" y="1050" width="322" height="58" rx="8"/>
    <text class="ink small" x="48" y="1074">Text summary + exact table fallback</text>
    <text class="muted small" x="48" y="1096">Pattern + label; no tooltip-only fact</text>
  </g>

  <g id="mobile-finance-f2">
    <rect class="card" x="16" y="1146" width="358" height="270" rx="14"/>
    <text class="ink h2" x="34" y="1180">F2 · Как финансируется бизнес?</text>
    <text class="muted small" x="34" y="1206">Seven calendar years; gaps stay visible.</text>
    <line class="zero" x1="190" y1="1230" x2="190" y2="1332"/>
    <rect class="bar" x="82" y="1242" width="108" height="22"/>
    <rect class="plainbar" x="190" y="1242" width="134" height="22"/>
    <rect class="plainbar" x="130" y="1278" width="60" height="22"/>
    <rect class="bar" x="190" y="1278" width="84" height="22"/>
    <rect class="dash" x="104" y="1314" width="170" height="22" rx="6"/>
    <text class="ink label" x="34" y="1364">NEGATIVE/MIXED SIGN/ZERO DENOMINATOR</text>
    <text class="muted small" x="34" y="1386">zero denominator → no ratio; gap ≠ zero</text>
  </g>

  <g id="mobile-finance-f3">
    <rect class="card" x="16" y="1432" width="358" height="270" rx="14"/>
    <text class="ink h2" x="34" y="1466">F3 · Как менялись выручка</text>
    <text class="ink h2" x="34" y="1488">и активы?</text>
    <text class="muted small" x="34" y="1514">No geometry crosses a missing point.</text>
    <polyline class="line" points="44,1618 96,1578 148,1600"/>
    <rect class="dash" x="164" y="1556" width="64" height="74" rx="8"/>
    <polyline class="line" points="244,1590 292,1564 340,1582"/>
    <text class="ink label" x="172" y="1598">MISSING</text>
    <text class="muted small" x="34" y="1656">EMPTY/MISSING • comparison omitted</text>
    <text class="muted small" x="34" y="1678">same text for keyboard and touch</text>
  </g>

  <g id="mobile-finance-f4">
    <rect class="card" x="16" y="1718" width="358" height="270" rx="14"/>
    <text class="ink h2" x="34" y="1752">F4 · Что остаётся с каждых</text>
    <text class="ink h2" x="34" y="1774">100 единиц выручки?</text>
    <text class="muted small" x="34" y="1800">Ratios require a positive denominator.</text>
    <line class="zero" x1="42" y1="1884" x2="348" y2="1884"/>
    <rect class="plainbar" x="68" y="1838" width="48" height="46"/>
    <rect class="bar" x="138" y="1856" width="48" height="28"/>
    <rect class="plainbar" x="208" y="1884" width="48" height="34"/>
    <rect class="bar" x="278" y="1870" width="48" height="14"/>
    <text class="ink label" x="34" y="1950">SIGNED • ZERO • UNAVAILABLE</text>
    <text class="muted small" x="34" y="1972">Neutral patterns; no red/green verdict</text>
  </g>

  <g id="mobile-finance-f5">
    <rect class="card" x="16" y="2004" width="358" height="300" rx="14"/>
    <text class="ink h2" x="34" y="2038">F5 · Финансовые показатели</text>
    <text class="ink h2" x="34" y="2060">по годам</text>
    <text class="muted small" x="34" y="2086">Fixed 9 × 7; backend display strings.</text>
    <rect class="dash" x="34" y="2104" width="322" height="146" rx="9"/>
    <g clip-path="url(#mobile-table-clip)">
      <rect class="subcard" x="46" y="2120" width="430" height="108" rx="6"/>
      <line class="thin" x1="162" y1="2120" x2="162" y2="2228"/>
      <line class="thin" x1="46" y1="2156" x2="476" y2="2156"/>
      <line class="thin" x1="46" y1="2192" x2="476" y2="2192"/>
      <text class="ink small" x="58" y="2144">Метрика</text>
      <text class="muted small" x="176" y="2144">7 periods → → →</text>
      <text class="muted small" x="58" y="2180">Exact / zero</text>
      <text class="muted small" x="58" y="2216">Missing = —</text>
    </g>
    <rect x="54" y="2236" width="244" height="5" rx="2.5" fill="#D1D5DB"/>
    <rect x="54" y="2236" width="106" height="5" rx="2.5" fill="#6B7280"/>
    <text class="ink small" x="312" y="2244">↔</text>
    <text class="ink label" x="46" y="2278">LOCAL TABLE SCROLL ONLY</text>
    <text class="muted small" x="46" y="2296">page width remains 390 / works at 320</text>
  </g>

  <g id="mobile-arbitration-a1">
    <rect class="card" x="16" y="2320" width="358" height="270" rx="14"/>
    <text class="ink h2" x="34" y="2354">A1 · Активность по годам</text>
    <text class="ink h2" x="34" y="2376">и ролям</text>
    <text class="muted small" x="34" y="2402">Bounded observed calendar; unknown separate.</text>
    <rect class="plainbar" x="54" y="2494" width="34" height="58"/>
    <rect class="bar" x="100" y="2466" width="34" height="86"/>
    <rect class="plainbar" x="146" y="2508" width="34" height="44"/>
    <rect class="bar" x="192" y="2448" width="34" height="104"/>
    <rect class="dash" x="238" y="2494" width="50" height="58" rx="7"/>
    <text class="ink label" x="34" y="2432">PARTIAL returned/total</text>
    <text class="muted small" x="34" y="2574">returned N / total M • not “no cases”</text>
  </g>

  <g id="mobile-arbitration-a2">
    <rect class="card" x="16" y="2606" width="358" height="270" rx="14"/>
    <text class="ink h2" x="34" y="2640">A2 · Роли компании</text>
    <text class="muted small" x="34" y="2666">Exact target attribution; four categories.</text>
    <rect class="bar" x="42" y="2700" width="260" height="24"/>
    <rect class="plainbar" x="42" y="2738" width="178" height="24"/>
    <rect class="bar" x="42" y="2776" width="92" height="24"/>
    <rect class="plainbar" x="42" y="2814" width="44" height="18"/>
    <text class="ink small" x="312" y="2718">P</text>
    <text class="ink small" x="230" y="2756">R</text>
    <text class="ink small" x="144" y="2794">O</text>
    <text class="ink small" x="96" y="2828">U</text>
    <text class="muted small" x="34" y="2856">Count + label + detail list; no percent at zero</text>
  </g>

  <g id="mobile-arbitration-a3">
    <rect class="card" x="16" y="2892" width="358" height="270" rx="14"/>
    <text class="ink h2" x="34" y="2926">A3 · Исходы</text>
    <text class="muted small" x="34" y="2952">Source-bound categories, not a verdict.</text>
    <circle cx="116" cy="3044" r="62" fill="none" stroke="#D1D5DB" stroke-width="28"/>
    <path d="M116 2982 A62 62 0 0 1 174 3064" fill="none" stroke="url(#mobile-neutral-pattern)" stroke-width="28"/>
    <line class="thin" x1="214" y1="2998" x2="336" y2="2998"/>
    <line class="thin" x1="214" y1="3032" x2="316" y2="3032"/>
    <line class="thin" x1="214" y1="3066" x2="294" y2="3066"/>
    <line class="thin" x1="214" y1="3100" x2="270" y2="3100"/>
    <text class="ink label" x="34" y="3134">ACCESSIBLE TEXT ALTERNATIVE • UNKNOWN EXPLICIT</text>
    <text class="muted small" x="34" y="3152">Patterns + labels; no tooltip-only fact</text>
  </g>

  <g id="mobile-arbitration-a4">
    <rect class="card" x="16" y="3178" width="358" height="270" rx="14"/>
    <text class="ink h2" x="34" y="3212">A4 · Суммы дел по валютам</text>
    <text class="muted small" x="34" y="3238">Exact source currency; no FX or debt wording.</text>
    <line class="zero" x1="188" y1="3266" x2="188" y2="3370"/>
    <rect class="bar" x="78" y="3280" width="110" height="24"/>
    <rect class="plainbar" x="188" y="3280" width="142" height="24"/>
    <rect class="plainbar" x="136" y="3318" width="52" height="24"/>
    <rect class="bar" x="188" y="3318" width="92" height="24"/>
    <rect class="dash" x="100" y="3356" width="180" height="20" rx="6"/>
    <text class="ink label" x="34" y="3406">ZERO / NEGATIVE / MISSING</text>
    <text class="muted small" x="34" y="3426">Missing ≠ zero; each currency stays separate</text>
  </g>

  <g id="mobile-arbitration-a5">
    <rect class="card" x="16" y="3464" width="358" height="290" rx="14"/>
    <text class="ink h2" x="34" y="3498">A5 · Частые оппоненты</text>
    <text class="muted small" x="34" y="3524">Safe aliases or masked ordinals only.</text>
    <rect class="subcard" x="34" y="3542" width="322" height="128" rx="9"/>
    <text class="ink small" x="48" y="3568">Юридическое лицо A</text>
    <text class="ink small" x="48" y="3596">Физическое лицо N</text>
    <text class="ink small" x="48" y="3624">Сторона скрыта N</text>
    <text class="muted small" x="48" y="3652">LONG label wraps; no name grouping</text>
    <text class="ink label" x="34" y="3700">LARGE-N shown N/M</text>
    <text class="muted small" x="34" y="3724">показано N из M • M is eligible population</text>
  </g>

  <g id="mobile-sources-limitations">
    <rect class="card" x="16" y="3770" width="358" height="240" rx="14"/>
    <text class="ink h2" x="34" y="3804">Источники и ограничения</text>
    <rect class="subcard" x="34" y="3822" width="322" height="76" rx="9"/>
    <text class="ink small" x="48" y="3848">counterparty → finance → arbitration</text>
    <text class="muted small" x="48" y="3874">scope/date/provenance remain separate</text>
    <rect class="subcard" x="34" y="3910" width="322" height="82" rx="9"/>
    <text class="ink small" x="48" y="3936">gate_closed / partial / missing</text>
    <text class="muted small" x="48" y="3962">No provider/unit semantics are guessed</text>
    <text class="muted small" x="48" y="3982">FOCUS/TOUCH uses the same safe detail</text>
  </g>

  <g id="mobile-neutral-actions">
    <rect class="card" x="16" y="4026" width="358" height="200" rx="14"/>
    <text class="ink h2" x="34" y="4060">Действия</text>
    <rect class="subcard" x="34" y="4078" width="322" height="54" rx="9"/>
    <text class="ink body" x="92" y="4110">Проверить другую компанию</text>
    <rect class="subcard" x="34" y="4144" width="322" height="54" rx="9"/>
    <text class="ink body" x="104" y="4176">Подготовить претензию</text>
    <text class="muted small" x="34" y="4216">Exact report binding • click does not create Claim</text>
  </g>

  <g id="mobile-cta-reserver">
    <rect class="dash" x="16" y="4242" width="358" height="210" rx="14"/>
    <text class="ink h3" x="34" y="4276">In-flow CTA reserver</text>
    <text class="muted small" x="34" y="4302">aria-hidden + inert • no focusable link</text>
    <text class="ink label" x="34" y="4332">NO OVERLAP</text>
    <text class="muted small" x="34" y="4358">same wrapped height as fixed bar</text>
    <text class="muted small" x="34" y="4382">server-rendered safe-area reserve</text>
    <text class="muted small" x="34" y="4406">200% zoom keeps controls reachable</text>
    <text class="ink label" x="34" y="4434">NO PAGE-WIDE HORIZONTAL OVERFLOW</text>
  </g>

  <g id="mobile-primary-cta">
    <rect x="0" y="4470" width="390" height="298" fill="#FFFFFF" stroke="#111827" stroke-width="3"/>
    <text class="ink label" x="16" y="4500">FIXED BOTTOM MOBILE BAR • 320–767</text>
    <text class="ink label" x="16" y="4522">STACKED • SAFE-AREA • FULL-WIDTH BUTTON</text>
    <text class="ink h2" x="28" y="4562">Вам задолжали?</text>
    <rect class="focusOuter" x="24" y="4584" width="342" height="82" rx="12"/>
    <rect class="focusInner" x="28" y="4588" width="334" height="74" rx="10"/>
    <rect class="cta" x="32" y="4592" width="326" height="66" rx="8"/>
    <text class="ctaText body" x="121" y="4632">Создать претензию</text>
    <text class="ink label" x="28" y="4702">FOCUS/TOUCH • #EE5A2A + DARK TEXT</text>
    <text class="muted small" x="28" y="4728">Desktop paragraph intentionally omitted</text>
    <text class="muted small" x="28" y="4750">safe-area inset remains inside reserved height</text>
  </g>

  <text class="muted small" x="16" y="4790">Wireframe only • final visual art belongs to later iterations.</text>
</svg>

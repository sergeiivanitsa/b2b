name: Setup locked Python CI
description: Install the exact iteration-25 CPython/test environment
inputs:
  release-sha:
    description: Exact verified 40-hex release commit
    required: true
runs:
  using: composite
  steps:
    - name: Set up exact CPython
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.11
        check-latest: false
    - name: Verify checkout and install hash-locked environment
      shell: bash
      env:
        RELEASE_SHA: ${{ inputs.release-sha }}
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PIP_NO_PYTHON_VERSION_WARNING: "1"
      run: |
        set -euo pipefail
        [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
        test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        python -m pip install --no-deps --only-binary=:all: --require-hashes -r .github/ci/python-bootstrap.lock
        python -m pip install --no-deps --only-binary=:all: --require-hashes -r .github/ci/python-test.lock
        python -m pip install --no-deps --no-build-isolation -e services/product_api -e services/gateway_api
        python -m pip check
        python scripts/check-python-ci-lock.py --strict-environment

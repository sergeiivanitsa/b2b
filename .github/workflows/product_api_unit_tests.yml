name: Legacy Product QA wrapper

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact lowercase main-history commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  compatibility-wrapper:
    name: compatibility-wrapper-only
    uses: ./.github/workflows/qa.yml
    with:
      release_sha: ${{ inputs.release_sha }}

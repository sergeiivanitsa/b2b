name: Deploy exact QA release to production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact lowercase commit already in protected main history
        required: true
        type: string
      p1_protection_evidence_base64:
        description: Base64 canonical current protection/reviewer evidence (P1; UNSET means STOP)
        required: true
        type: string
      p1_protection_evidence_sha256:
        description: SHA-256 of decoded P1 evidence
        required: true
        type: string
      p2_evidence_sha256:
        description: Backup/restore/schema/drain evidence digest (UNSET means STOP)
        required: true
        type: string
      p3_evidence_sha256:
        description: Cohort decision evidence digest (activation remains not-authorized)
        required: true
        type: string
      p4_evidence_sha256:
        description: Monitoring/owner/abort evidence digest (UNSET means STOP)
        required: true
        type: string
      p5_evidence_sha256:
        description: Seeded current+2 and compatible-image evidence digest (UNSET means STOP)
        required: true
        type: string
      p6_evidence_sha256:
        description: Provider-preservation decision digest (UNSET means STOP)
        required: true
        type: string
      p7_evidence_sha256:
        description: AI fallback-only decision digest (UNSET means STOP)
        required: true
        type: string
      p8_evidence_sha256:
        description: Privacy-key no-activation decision digest (UNSET means STOP)
        required: true
        type: string
      p9_evidence_sha256:
        description: Indexing noindex/no-assignment decision digest (UNSET means STOP)
        required: true
        type: string
      drain_deadline_seconds:
        description: P1-approved worker drain deadline; no repository default
        required: true
        type: string
      drain_stable_interval_seconds:
        description: P1-approved stable-snapshot interval; no repository default
        required: true
        type: string
      provider_mode:
        description: Preserve the existing production provider state
        required: true
        type: choice
        options: [preserve]
      ai_mode:
        description: Must remain fallback-only for this deploy
        required: true
        type: choice
        options: [fallback-only]
      indexing_mode:
        description: Must remain noindex/no-assignment for this deploy
        required: true
        type: choice
        options: [noindex-no-assignment]

permissions:
  contents: read
  actions: read

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  trusted-main-and-p1:
    name: trusted-main-and-p1
    runs-on: ubuntu-24.04
    outputs:
      release_sha: ${{ steps.guard.outputs.release_sha }}
    steps:
      - name: Check out current protected main with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Prove current trusted workflow and requested ancestry before local code
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          PROTECTED_REPOSITORY: ${{ vars.PROTECTED_REPOSITORY }}
          ACTUAL_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test -n "$PROTECTED_REPOSITORY"
          test "$ACTUAL_REPOSITORY" = "$PROTECTED_REPOSITORY"
          test "$WORKFLOW_REF" = "$ACTUAL_REPOSITORY/.github/workflows/deploy_prod.yml@refs/heads/main"
          protected_main="$(git rev-parse HEAD)"
          test "$WORKFLOW_SHA" = "$protected_main"
          test "$(git rev-parse "$WORKFLOW_SHA:.github/workflows/deploy_prod.yml")" = "$(git rev-parse "$protected_main:.github/workflows/deploy_prod.yml")"
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" "$protected_main"
      - name: Check out exact trusted main-history release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up locked Python
        uses: ./.github/actions/setup-python-ci
        with:
          release-sha: ${{ inputs.release_sha }}
      - name: Validate external P1-P9 STOP gates
        id: guard
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ACTUAL_REPOSITORY: ${{ github.repository }}
          P1_EVIDENCE_BASE64: ${{ inputs.p1_protection_evidence_base64 }}
          P1_EVIDENCE_SHA256: ${{ inputs.p1_protection_evidence_sha256 }}
          P2_EVIDENCE_SHA256: ${{ inputs.p2_evidence_sha256 }}
          P3_EVIDENCE_SHA256: ${{ inputs.p3_evidence_sha256 }}
          P4_EVIDENCE_SHA256: ${{ inputs.p4_evidence_sha256 }}
          P5_EVIDENCE_SHA256: ${{ inputs.p5_evidence_sha256 }}
          P6_EVIDENCE_SHA256: ${{ inputs.p6_evidence_sha256 }}
          P7_EVIDENCE_SHA256: ${{ inputs.p7_evidence_sha256 }}
          P8_EVIDENCE_SHA256: ${{ inputs.p8_evidence_sha256 }}
          P9_EVIDENCE_SHA256: ${{ inputs.p9_evidence_sha256 }}
          PROVIDER_MODE: ${{ inputs.provider_mode }}
          AI_MODE: ${{ inputs.ai_mode }}
          INDEXING_MODE: ${{ inputs.indexing_mode }}
          DRAIN_DEADLINE_SECONDS: ${{ inputs.drain_deadline_seconds }}
          DRAIN_STABLE_INTERVAL_SECONDS: ${{ inputs.drain_stable_interval_seconds }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python - <<'PY'
          import base64, binascii, datetime, hashlib, json, os, re
          digest = re.compile(r"^[0-9a-f]{64}$")
          for name in ("P1_EVIDENCE_SHA256", "P2_EVIDENCE_SHA256", "P3_EVIDENCE_SHA256", "P4_EVIDENCE_SHA256", "P5_EVIDENCE_SHA256", "P6_EVIDENCE_SHA256", "P7_EVIDENCE_SHA256", "P8_EVIDENCE_SHA256", "P9_EVIDENCE_SHA256"):
              if digest.fullmatch(os.environ[name]) is None:
                  raise SystemExit(f"{name} is UNSET/invalid; STOP")
          if os.environ["PROVIDER_MODE"] != "preserve" or os.environ["AI_MODE"] != "fallback-only" or os.environ["INDEXING_MODE"] != "noindex-no-assignment":
              raise SystemExit("positive production mode is not authorized")
          for name in ("DRAIN_DEADLINE_SECONDS", "DRAIN_STABLE_INTERVAL_SECONDS"):
              try:
                  value = float(os.environ[name])
              except ValueError as exc:
                  raise SystemExit(f"{name} is UNSET/invalid; STOP") from exc
              if not value > 0 or not value < float("inf"):
                  raise SystemExit(f"{name} is UNSET/invalid; STOP")
          try:
              raw = base64.b64decode(os.environ["P1_EVIDENCE_BASE64"], validate=True)
          except binascii.Error as exc:
              raise SystemExit("P1 evidence is not strict base64; STOP") from exc
          if hashlib.sha256(raw).hexdigest() != os.environ["P1_EVIDENCE_SHA256"]:
              raise SystemExit("P1 evidence digest mismatch; STOP")
          if raw.startswith(b"\xef\xbb\xbf") or b"\r" in raw or not raw.endswith(b"\n"):
              raise SystemExit("P1 evidence bytes are not canonical; STOP")
          data = json.loads(raw.decode("utf-8"))
          expected_keys = {
              "schema_version", "repository", "protected_ref", "release_sha",
              "required_statuses", "production_environment_required_reviewers",
              "observed_at_utc", "valid_until_utc", "deployment_window_start_utc",
              "deployment_window_end_utc", "drain_deadline_seconds",
              "drain_stable_interval_seconds",
          }
          if set(data) != expected_keys or data["schema_version"] != "github_protection_evidence_v1":
              raise SystemExit("P1 evidence schema mismatch; STOP")
          if data["repository"] != os.environ["ACTUAL_REPOSITORY"] or data["protected_ref"] != "refs/heads/main":
              raise SystemExit("P1 repository/ref mismatch; STOP")
          if data["release_sha"] != os.environ["RELEASE_SHA"]:
              raise SystemExit("P1 release SHA mismatch; STOP")
          if data["required_statuses"] != ["qa-required"] or data["production_environment_required_reviewers"] is not True:
              raise SystemExit("P1 required status/reviewer protection absent; STOP")
          for evidence_name, input_name in (
              ("drain_deadline_seconds", "DRAIN_DEADLINE_SECONDS"),
              ("drain_stable_interval_seconds", "DRAIN_STABLE_INTERVAL_SECONDS"),
          ):
              evidence_value = data[evidence_name]
              if type(evidence_value) not in {int, float} or float(evidence_value) != float(os.environ[input_name]):
                  raise SystemExit("P1 drain bound mismatch; STOP")
          canonical = (json.dumps(data, separators=(",", ":"), sort_keys=True) + "\n").encode()
          if canonical != raw:
              raise SystemExit("P1 evidence is not canonical JSON; STOP")
          def instant(value):
              if not isinstance(value, str) or not value.endswith("Z"):
                  raise SystemExit("P1 evidence time invalid; STOP")
              return datetime.datetime.fromisoformat(value[:-1] + "+00:00")
          now = datetime.datetime.now(datetime.timezone.utc)
          if not instant(data["observed_at_utc"]) <= now <= instant(data["valid_until_utc"]):
              raise SystemExit("P1 evidence is stale/not yet valid; STOP")
          window_start = instant(data["deployment_window_start_utc"])
          window_end = instant(data["deployment_window_end_utc"])
          if not window_start < window_end or not window_start <= now <= window_end:
              raise SystemExit("outside the P1-approved deployment window; STOP")
          PY
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  qa:
    name: qa-required dependency
    needs: trusted-main-and-p1
    uses: ./.github/workflows/qa.yml
    with:
      release_sha: ${{ needs.trusted-main-and-p1.outputs.release_sha }}

  deploy:
    name: exact-SHA protected production deploy
    needs: [trusted-main-and-p1, qa]
    if: needs.qa.outputs.verified_release_sha == needs.trusted-main-and-p1.outputs.release_sha
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check out exact QA release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.trusted-main-and-p1.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up locked Python
        uses: ./.github/actions/setup-python-ci
        with:
          release-sha: ${{ needs.trusted-main-and-p1.outputs.release_sha }}
      - name: Download sole build-once release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.qa.outputs.release_artifact_name }}
          path: .release/deploy
      - name: Download canonical QA attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.qa.outputs.attestation_artifact_name }}
          path: .release/deploy-attestation
      - name: Reverify one SHA through attestation, manifests and artifacts
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-main-and-p1.outputs.release_sha }}
          VERIFIED_RELEASE_SHA: ${{ needs.qa.outputs.verified_release_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$VERIFIED_RELEASE_SHA" = "$RELEASE_SHA"
          cd .release/deploy
          sha256sum --check "checksums-$RELEASE_SHA.txt"
          cd ../..
          python deploy/product_api/release_manifest.py "$PWD/.release/deploy" "$RELEASE_SHA"
          python - <<'PY'
          import json, os
          from hashlib import sha256
          from pathlib import Path
          release_sha = os.environ["RELEASE_SHA"]
          release_path = Path(".release/deploy") / f"release-manifest-{release_sha}.json"
          attestation_path = Path(".release/deploy-attestation") / f"qa-attestation-{release_sha}.json"
          release = json.loads(release_path.read_text(encoding="utf-8"))
          attestation_raw = attestation_path.read_bytes()
          if attestation_raw.startswith(b"\xef\xbb\xbf") or b"\r" in attestation_raw or not attestation_raw.endswith(b"\n"):
              raise SystemExit("QA attestation bytes are not canonical; STOP")
          attestation = json.loads(attestation_raw.decode("utf-8"))
          if attestation_raw != (json.dumps(attestation, separators=(",", ":"), sort_keys=True) + "\n").encode():
              raise SystemExit("QA attestation JSON is not canonical; STOP")
          if set(attestation) != {
              "schema_version", "verified_release_sha", "release_artifact_name",
              "release_manifest_name", "release_manifest_sha256", "job_conclusions",
              "workflow_run_attempt", "workflow_run_id",
          } or attestation.get("schema_version") != "company_card_v2_qa_attestation_v1":
              raise SystemExit("QA attestation schema mismatch; STOP")
          if release.get("release_sha") != release_sha or attestation.get("verified_release_sha") != release_sha:
              raise SystemExit("release/attestation SHA mismatch; STOP")
          if attestation.get("release_artifact_name") != f"qa-release-{release_sha}" or attestation.get("release_manifest_name") != release_path.name:
              raise SystemExit("release/attestation artifact identity mismatch; STOP")
          if attestation.get("release_manifest_sha256") != sha256(release_path.read_bytes()).hexdigest():
              raise SystemExit("attested release manifest digest mismatch; STOP")
          jobs = attestation.get("job_conclusions")
          if not isinstance(jobs, dict) or set(jobs) != {
              "UNIT_RESULT", "POSTGRES_RESULT", "WEB_RESULT", "BUILD_RESULT",
              "BROWSER_RESULT", "CONTRACT_RESULT", "REHEARSAL_RESULT",
          } or set(jobs.values()) != {"success"}:
              raise SystemExit("QA attestation is not wholly successful; STOP")
          if type(attestation.get("workflow_run_attempt")) is not int or attestation["workflow_run_attempt"] < 1 or type(attestation.get("workflow_run_id")) is not int or attestation["workflow_run_id"] < 1:
              raise SystemExit("QA attestation workflow identity is invalid; STOP")
          PY
      - name: Configure strict SSH host identities
        shell: bash
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          RU_SSH_KNOWN_HOSTS: ${{ secrets.RU_SSH_KNOWN_HOSTS }}
          US_SSH_KNOWN_HOSTS: ${{ secrets.US_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PROD_SSH_KEY"
          test -n "$RU_SSH_KNOWN_HOSTS"
          test -n "$US_SSH_KNOWN_HOSTS"
          command -v ssh-agent >/dev/null
          command -v ssh-add >/dev/null
          install -m 700 -d "$RUNNER_TEMP/iteration25-ssh"
          printf '%s\n%s\n' "$RU_SSH_KNOWN_HOSTS" "$US_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/iteration25-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/iteration25-ssh/known_hosts"
          eval "$(ssh-agent -s)"
          printf '%s\n' "$PROD_SSH_KEY" | ssh-add - >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Read-only RU/US preflight and record compatible prior identities
        id: preflight
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-main-and-p1.outputs.release_sha }}
          RU_TARGET: ${{ secrets.RU_DEPLOY_TARGET }}
          US_TARGET: ${{ secrets.US_DEPLOY_TARGET }}
          RU_RELEASE_ROOT: ${{ vars.RU_RELEASE_ROOT }}
          US_RELEASE_ROOT: ${{ vars.US_RELEASE_ROOT }}
          DRAIN_DEADLINE_SECONDS: ${{ inputs.drain_deadline_seconds }}
          DRAIN_STABLE_INTERVAL_SECONDS: ${{ inputs.drain_stable_interval_seconds }}
        run: |
          set -euo pipefail
          [[ "$RU_TARGET" =~ ^[A-Za-z0-9._-]+@[A-Za-z0-9.-]+$ ]]
          [[ "$US_TARGET" =~ ^[A-Za-z0-9._-]+@[A-Za-z0-9.-]+$ ]]
          [[ "$RU_RELEASE_ROOT" =~ ^/[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9][A-Za-z0-9._-]*){2,}$ ]]
          [[ "$US_RELEASE_ROOT" =~ ^/[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9][A-Za-z0-9._-]*){2,}$ ]]
          bash deploy/production_runtime_preflight.sh \
            "$RELEASE_SHA" \
            "$RU_TARGET" \
            "$US_TARGET" \
            "$RU_RELEASE_ROOT" \
            "$US_RELEASE_ROOT" \
            "$RUNNER_TEMP/iteration25-ssh/known_hosts" \
            "$DRAIN_DEADLINE_SECONDS" \
            "$DRAIN_STABLE_INTERVAL_SECONDS" \
            "$PWD/.release/production-preflight"
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/iteration25-ssh/known_hosts")
          ssh "${ssh_args[@]}" "$RU_TARGET" bash -s -- "$RU_RELEASE_ROOT" <<'REMOTE'
          set -euo pipefail
          RU_RELEASE_ROOT=$1
          state_root=/var/lib/pork/deploy-state
          active="$state_root/fresh-install-active.json"
          success="$state_root/fresh-install-success.json"
          command -v python3 >/dev/null
          command -v systemctl >/dev/null
          test -d "$state_root" && test ! -L "$state_root"
          test "$(realpath -e -- "$state_root")" = "$state_root"
          test "$(stat -c '%u:%g:%a' -- "$state_root")" = 0:0:750
          test ! -e "$active" && test ! -L "$active"
          test -f "$success" && test ! -L "$success"
          test "$(stat -c '%u:%g:%a' -- "$success")" = 0:0:640
          python3 - "$success" "$RU_RELEASE_ROOT" <<'PY'
          import json
          import re
          import sys

          path, release_root = sys.argv[1:]
          raw = open(path, encoding="utf-8", newline="").read()
          value = json.loads(raw)
          if not isinstance(value, dict):
              raise SystemExit("fresh-install success receipt is not an object; STOP")
          release_sha = value.get("release_sha")
          if not isinstance(release_sha, str) or re.fullmatch(r"[0-9a-f]{40}", release_sha) is None:
              raise SystemExit("fresh-install success release identity is invalid; STOP")
          expected = {
              "phase": "success",
              "release_sha": release_sha,
              "schema_version": "production_fresh_install_global_v1",
              "stage": f"{release_root}/{release_sha}-fresh-install",
          }
          if value != expected or raw != json.dumps(expected, separators=(",", ":"), sort_keys=True) + "\n":
              raise SystemExit("fresh-install success receipt is not canonical; STOP")
          PY
          mapfile -t recovery_units < <(
            {
              systemctl list-units --all --type=service --full --no-legend --no-pager 'pork-production-fresh-install-*.service'
              systemctl list-unit-files --type=service --full --no-legend --no-pager 'pork-production-fresh-install-*.service'
              systemctl list-units --all --type=service --full --no-legend --no-pager 'pork-legacy-0015-bootstrap-*.service'
              systemctl list-unit-files --type=service --full --no-legend --no-pager 'pork-legacy-0015-bootstrap-*.service'
            } | awk 'NF {print $1}' | sort -u
          )
          for unit in "${recovery_units[@]}"; do
            [[ "$unit" =~ ^pork-(production-fresh-install|legacy-0015-bootstrap)-[a-z0-9-]+\.service$ ]]
            active_state=$(systemctl show --property=ActiveState --value "$unit")
            case "$active_state" in
              active|activating|deactivating|reloading|failed)
                echo "fresh-install recovery unit is not quiescent: $unit ($active_state); STOP" >&2
                exit 2
                ;;
              inactive) ;;
              *)
                echo "fresh-install recovery unit has an unknown state: $unit ($active_state); STOP" >&2
                exit 2
                ;;
            esac
            if enabled_state=$(systemctl is-enabled "$unit" 2>/dev/null); then
              enabled_status=0
            else
              enabled_status=$?
            fi
            case "$enabled_state" in
              enabled|enabled-runtime|linked|linked-runtime|alias)
                echo "fresh-install recovery unit remains enabled: $unit ($enabled_state/$enabled_status); STOP" >&2
                exit 2
                ;;
              disabled|masked|static|indirect|not-found) ;;
              *)
                echo "fresh-install recovery unit has an unknown enablement state: $unit ($enabled_state/$enabled_status); STOP" >&2
                exit 2
                ;;
            esac
          done
          REMOTE
          ssh "${ssh_args[@]}" "$RU_TARGET" "set -euo pipefail; command -v docker >/dev/null; command -v python3 >/dev/null; command -v psql >/dev/null; command -v curl >/dev/null; command -v sha256sum >/dev/null; command -v getent >/dev/null; command -v ps >/dev/null; command -v runuser >/dev/null; test \"\$(id -u)\" -eq 0; nginx_group_id=\$(getent group www-data | cut -d: -f3); printf '%s\n' \"\$nginx_group_id\" | grep -Eq '^[1-9][0-9]*$'; nginx_user=\$(nginx -T 2>/dev/null | awk '\$1 == \"user\" && NF == 2 { value=\$2; sub(/;\$/, \"\", value); print value }'); test \"\$nginx_user\" = www-data; nginx_workers=\$(ps -C nginx -o user=,group= | awk '\$1 != \"root\" {print \$1 \":\" \$2}' | sort -u); test \"\$nginx_workers\" = www-data:www-data; test -f /opt/b2b/.env.product; python3 -c \"import pathlib,sys; rows={}; [rows.__setitem__(*raw.split('=',1)) for raw in pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines() if raw and not raw.lstrip().startswith('#') and '=' in raw]; (rows.get('CLAIMS_UPLOAD_ROOT') == '/var/lib/pork/claims-uploads/v1' and rows.get('CLAIMS_UPLOAD_DIR') == '/data/claims_uploads') or sys.exit('persistent Claims upload mapping is not configured; STOP')\" /opt/b2b/.env.product; claims_root=/var/lib/pork/claims-uploads/v1; test -d \"\$claims_root\"; test ! -L \"\$claims_root\"; test \"\$(realpath -e -- \"\$claims_root\")\" = \"\$claims_root\"; test \"\$(stat -c '%u:%g:%a' -- \"\$claims_root\")\" = 0:0:750; test -d '$RU_RELEASE_ROOT'; test ! -L '$RU_RELEASE_ROOT'; test ! -e '$RU_RELEASE_ROOT/$RELEASE_SHA'; test -d /var/lib/pork/company-public-h2/v1/manifests/sha256; test -f /var/lib/pork/company-public-h2/v1/manifest-set.json; test -f /var/lib/pork/web-ui/v1/release-set.json; test -d /var/lib/pork/web-ui/v1/releases; test -L /var/lib/pork/web-ui/v1/current; test \"\$(stat -c '%u:%g:%a' /var/lib/pork/company-public-h2)\" = \"0:\$nginx_group_id:750\"; test \"\$(stat -c '%u:%g:%a' /var/lib/pork/company-public-h2/v1)\" = \"0:\$nginx_group_id:750\"; test \"\$(stat -c '%u:%g:%a' /var/lib/pork/web-ui)\" = \"0:\$nginx_group_id:750\"; test \"\$(stat -c '%u:%g:%a' /var/lib/pork/web-ui/v1)\" = \"0:\$nginx_group_id:750\"; test -z \"\$(find /var/lib/pork/company-public-h2/v1 /var/lib/pork/web-ui/v1 -xdev ! -type l \\( ! -user root -o ! -group www-data -o -type d ! -perm 0750 -o -type f ! -perm 0640 \\) -print -quit)\"; test -z \"\$(runuser --user www-data --group www-data -- find /var/lib/pork/company-public-h2/v1 /var/lib/pork/web-ui/v1/current/site -xdev \\( -type d ! -executable -o -type f ! -readable \\) -print -quit)\"; product_id=\$(docker compose -f /opt/b2b/docker-compose.product.yml --env-file /opt/b2b/.env.product ps -q product_api); report_id=\$(docker compose -f /opt/b2b/docker-compose.product.yml --env-file /opt/b2b/.env.product ps -q company_report_worker); narrative_id=\$(docker compose -f /opt/b2b/docker-compose.product.yml --env-file /opt/b2b/.env.product ps -q company_card_narrative_worker); test -n \"\$product_id\"; test -n \"\$report_id\"; test -n \"\$narrative_id\"; test \"\$(docker inspect --format '{{range .Mounts}}{{if eq .Destination \"/data/claims_uploads\"}}{{printf \"%s|%s|%t\" .Source .Destination .RW}}{{end}}{{end}}' \"\$product_id\")\" = '/var/lib/pork/claims-uploads/v1|/data/claims_uploads|true'; product_image=\$(docker inspect --format '{{.Image}}' \"\$product_id\"); test \"\$(docker inspect --format '{{.Image}}' \"\$report_id\")\" = \"\$product_image\"; test \"\$(docker inspect --format '{{.Image}}' \"\$narrative_id\")\" = \"\$product_image\""
          mkdir -p .release/prior

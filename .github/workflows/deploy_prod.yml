          ssh "${ssh_args[@]}" "$RU_TARGET" "set -euo pipefail; umask 027; prior_pointer=\$(cat '$RU_STAGE/prior-web-pointer'); grep -Eq '^releases/[0-9a-f]{40}$' '$RU_STAGE/prior-web-pointer'; test -f \"/var/lib/pork/web-ui/v1/\$prior_pointer/site/index.html\"; history_tmp='/var/lib/pork/web-ui/v1/.release-set.rollback-$RELEASE_SHA'; pointer_tmp='/var/lib/pork/web-ui/v1/.current.rollback-$RELEASE_SHA'; test ! -e \"\$history_tmp\"; test ! -e \"\$pointer_tmp\"; runuser --user root --group www-data -- install -m 640 '$RU_STAGE/prior-web-release-set.json' \"\$history_tmp\"; mv -T \"\$history_tmp\" /var/lib/pork/web-ui/v1/release-set.json; ln -s \"\$prior_pointer\" \"\$pointer_tmp\"; mv -T \"\$pointer_tmp\" /var/lib/pork/web-ui/v1/current; test \"\$(readlink /var/lib/pork/web-ui/v1/current)\" = \"\$prior_pointer\"; test -z \"\$(runuser --user www-data --group www-data -- find /var/lib/pork/web-ui/v1 -xdev \\( -type d ! -executable -o -type f ! -readable \\) -print -quit)\"; install -m 640 '$RU_STAGE/prior-nginx.conf' /etc/nginx/sites-available/pork.su.conf; nginx -t; systemctl reload nginx; curl --fail --silent --show-error --resolve pork.su:443:127.0.0.1 https://pork.su/ >/dev/null"
      - name: Stop local deploy credential agent
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SSH_AGENT_PID:-}"
          ssh-agent -k >/dev/null

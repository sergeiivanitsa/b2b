name: Deploy prod

on:
  push:
    branches:
      - main

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.RU_HOST }}" >> ~/.ssh/known_hosts
          ssh-keyscan -H "${{ secrets.US_HOST }}" >> ~/.ssh/known_hosts

      - name: Checkout deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/web_ui/package-lock.json

      - name: Build web_ui static bundle
        run: |
          npm ci --prefix services/web_ui
          npm run build --prefix services/web_ui
          tar -C services/web_ui/dist -czf /tmp/web_ui-dist.tgz .

      - name: Deploy RU
        run: |
          ssh -o StrictHostKeyChecking=yes "${{ secrets.RU_USER }}@${{ secrets.RU_HOST }}" <<'EOF'
          set -euo pipefail
          cd /opt/b2b
          DEPLOY_COMMIT='${{ github.sha }}'
          git fetch origin
          git checkout main
          git reset --hard "$DEPLOY_COMMIT"
          export PRODUCT_IMAGE_TAG="$DEPLOY_COMMIT"

          # Stop the old worker before changing schema or code. Queued jobs stay queued.
          docker compose -f docker-compose.product.yml --env-file .env.product stop -t 40 company_report_worker || true

          # Build the exact deployed Product image once. The migration, API and
          # worker all reference this same commit-tagged image.
          docker compose -f docker-compose.product.yml --env-file .env.product build product_api

          # A migration failure stops this shell before either new process starts.
          docker compose -f docker-compose.product.yml --env-file .env.product run --rm -T --no-deps product_api sh -lc "cd /app/services/product_api && alembic -c alembic.ini upgrade head" </dev/null

          docker compose -f docker-compose.product.yml --env-file .env.product up -d --force-recreate --no-deps product_api company_report_worker
          # health retry ~60s (12*5s)
          ok=0
          for i in $(seq 1 12); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              echo "RU health OK"
              ok=1
              break
            fi
            echo "RU health not ready ($i/12), waiting..."
            sleep 5
          done

          if [ "$ok" -ne 1 ]; then
            echo "RU health FAILED — docker ps:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true
            echo "RU logs (last 200):"
            docker logs --tail 200 b2b-product_api-1 || true
            exit 1
          fi

          api_id="$(docker compose -f docker-compose.product.yml --env-file .env.product ps -q product_api)"
          worker_id="$(docker compose -f docker-compose.product.yml --env-file .env.product ps -q company_report_worker)"
          if [ -z "$api_id" ] || [ -z "$worker_id" ]; then
            echo "Product API or CompanyReport worker container is missing"
            exit 1
          fi

          api_running="$(docker inspect -f '{{.State.Running}}' "$api_id")"
          api_restarting="$(docker inspect -f '{{.State.Restarting}}' "$api_id")"
          if [ "$api_running" != "true" ] || [ "$api_restarting" != "false" ]; then
            echo "Product API is not stably running"
            docker inspect -f 'NAME={{.Name}} STATUS={{.State.Status}} RESTARTING={{.State.Restarting}} IMAGE={{.Image}}' "$api_id"
            exit 1
          fi

          worker_running="$(docker inspect -f '{{.State.Running}}' "$worker_id")"
          worker_restarting="$(docker inspect -f '{{.State.Restarting}}' "$worker_id")"
          if [ "$worker_running" != "true" ] || [ "$worker_restarting" != "false" ]; then
            echo "CompanyReport worker is not stably running"
            docker inspect -f 'NAME={{.Name}} STATUS={{.State.Status}} RESTARTING={{.State.Restarting}} IMAGE={{.Image}}' "$worker_id"
            exit 1
          fi

          expected_image_id="$(docker image inspect -f '{{.Id}}' "b2b-product-api:${PRODUCT_IMAGE_TAG}")"
          api_image_id="$(docker inspect -f '{{.Image}}' "$api_id")"
          worker_image_id="$(docker inspect -f '{{.Image}}' "$worker_id")"
          if [ "$api_image_id" != "$worker_image_id" ] || [ "$api_image_id" != "$expected_image_id" ]; then
            echo "Product API and worker image IDs do not match the deployed commit tag"
            exit 1
          fi
          docker inspect -f 'NAME={{.Name}} CREATED={{.Created}} STARTED={{.State.StartedAt}} IMAGE={{.Image}}' "$api_id" "$worker_id"
          EOF

      - name: Deploy US
        run: |
          ssh -o StrictHostKeyChecking=yes "${{ secrets.US_USER }}@${{ secrets.US_HOST }}" <<'EOF'
          set -euo pipefail
          cd /opt/b2b
          git fetch origin
          git checkout main
          git reset --hard origin/main

          cp -f deploy/us/compose/docker-compose.gateway.yml docker-compose.gateway.yml
          docker compose -f docker-compose.gateway.yml --env-file .env.gateway up -d --build

          # health retry ~60s (12*5s)
          ok=0
          for i in $(seq 1 12); do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null; then
              echo "US health OK"
              ok=1
              break
            fi
            echo "US health not ready ($i/12), waiting..."
            sleep 5
          done

          if [ "$ok" -ne 1 ]; then
            echo "US health FAILED — docker ps:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true
            echo "US logs (last 200):"
            docker logs --tail 200 b2b-gateway_api-1 || true
            exit 1
          fi
          EOF

      - name: Deploy web_ui static on RU
        run: |
          scp -o StrictHostKeyChecking=yes /tmp/web_ui-dist.tgz "${{ secrets.RU_USER }}@${{ secrets.RU_HOST }}:/tmp/web_ui-dist.tgz"
          ssh -o StrictHostKeyChecking=yes "${{ secrets.RU_USER }}@${{ secrets.RU_HOST }}" <<'EOF'
          set -euo pipefail
          WEB_UI_DIST_DIR="/opt/b2b/services/web_ui/dist"

          mkdir -p "$WEB_UI_DIST_DIR"
          find "$WEB_UI_DIST_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar -xzf /tmp/web_ui-dist.tgz -C "$WEB_UI_DIST_DIR"
          rm -f /tmp/web_ui-dist.tgz

          if command -v sudo >/dev/null 2>&1; then
            sudo nginx -t
            sudo systemctl reload nginx
          else
            nginx -t
            systemctl reload nginx
          fi

          curl -fsS --resolve pork.su:443:127.0.0.1 https://pork.su/ >/dev/null

          whoami_code="$(curl -s -o /dev/null -w "%{http_code}" --resolve pork.su:443:127.0.0.1 https://pork.su/api/internal/whoami || true)"
          if [ "$whoami_code" != "401" ] && [ "$whoami_code" != "200" ]; then
            echo "Unexpected /api/internal/whoami status: $whoami_code"
            exit 1
          fi
          EOF

          ! grep -Fq 'company-public-h2' /etc/nginx/sites-available/pork.su.conf
          if test -e /var/lib/pork/web-ui/v1 || test -L /var/lib/pork/web-ui/v1; then
            test -d /var/lib/pork/web-ui/v1 && test ! -L /var/lib/pork/web-ui/v1
            test ! -e /var/lib/pork/web-ui/v1/current
            test ! -L /var/lib/pork/web-ui/v1/current
            test ! -e /var/lib/pork/web-ui/v1/release-set.json
            test ! -L /var/lib/pork/web-ui/v1/release-set.json
            if test "$rolled_back_retry" = false; then
              test -z "$(timeout --foreground --signal=TERM --kill-after=30 "${OPERATION_TIMEOUT_SECONDS}s" find /var/lib/pork/web-ui/v1 -mindepth 1 -maxdepth 1 -print -quit)"
            fi
          fi
          if test -e /var/lib/pork/company-public-h2/v1 || test -L /var/lib/pork/company-public-h2/v1; then
            test -d /var/lib/pork/company-public-h2/v1 && test ! -L /var/lib/pork/company-public-h2/v1
            if test "$rolled_back_retry" = false; then
              test -z "$(timeout --foreground --signal=TERM --kill-after=30 "${OPERATION_TIMEOUT_SECONDS}s" find /var/lib/pork/company-public-h2/v1 -mindepth 1 -maxdepth 1 -print -quit)"
            fi
          fi
          test -f "$RECOVERY_HOOK" && test ! -L "$RECOVERY_HOOK" && test -x "$RECOVERY_HOOK"
          test -f "$BACKUP_ARTIFACT" && test ! -L "$BACKUP_ARTIFACT"
          test "$(timeout --foreground --signal=TERM --kill-after=30 "${OPERATION_TIMEOUT_SECONDS}s" sha256sum "$RECOVERY_HOOK" | cut -d' ' -f1)" = "$RECOVERY_HOOK_SHA256"
          test "$(timeout --foreground --signal=TERM --kill-after=30 "${OPERATION_TIMEOUT_SECONDS}s" sha256sum "$BACKUP_ARTIFACT" | cut -d' ' -f1)" = "$BACKUP_SHA256"
          timeout --foreground --signal=TERM --kill-after=30 "${ROLLBACK_TIMEOUT_SECONDS}s" "$RECOVERY_HOOK" verify "$BACKUP_ARTIFACT" "$BACKUP_ARTIFACT_ID" "$BACKUP_SHA256" 0015_claims_company_report_handoff >/dev/null 2>&1
          provider_state=$(docker exec "$product_id" python -c "from product_api.settings import get_settings; print('enabled' if get_settings().datanewton_enabled else 'disabled')")
          test "$provider_state" = enabled -o "$provider_state" = disabled
          printf '%s\n' "$product_id" > "$stage/prior-product-id"
          printf '%s\n' "$report_id" > "$stage/prior-report-id"
          printf '%s\n' "$old_image" > "$stage/prior-product-image-id"
          printf '%s\n' "$project" > "$stage/prior-product-compose-project"
          printf '%s\n' "$provider_state" > "$stage/prior-provider-state"
          printf '%s\n' "$legacy_web_tree_sha256" > "$stage/prior-web-tree-sha256"
          cp --no-preserve=mode,ownership /opt/b2b/docker-compose.product.yml "$stage/prior-docker-compose.product.yml"
          cp --no-preserve=mode,ownership /etc/nginx/sites-available/pork.su.conf "$stage/prior-nginx.conf"

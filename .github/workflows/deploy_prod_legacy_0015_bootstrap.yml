name: One-time production bootstrap from exact legacy 0015

# External recovery contract: verify-current-frozen must atomically bind the
# supplied immutable identity to the exact quiesced revision-0015 recovery
# point and fail unless that point is restorable.  This workflow never creates
# or pretends to create a production backup.  Restore/verify phases must be
# idempotent, interruption-safe and complete within the explicit per-operation
# rollback bound; the boot-persistent service retries marker-driven recovery.

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact lowercase candidate commit already in protected main history
        required: true
        type: string
      prior_release_sha:
        description: Exact only authorized legacy production release
        required: true
        default: 6bee95e881a3e9ea1fe324ca13c11ae239f896f4
        type: string
      prior_product_image_config_sha256:
        description: Reviewed exact legacy Product image config SHA-256 without prefix
        required: true
        type: string
      prior_product_compose_sha256:
        description: Reviewed exact legacy docker-compose.product.yml SHA-256
        required: true
        type: string
      prior_nginx_sha256:
        description: Reviewed exact live legacy pork.su nginx config SHA-256
        required: true
        type: string
      prior_web_tree_sha256:
        description: Reviewed canonical bounded legacy Web file-tree SHA-256
        required: true
        type: string
      seed_bundle_run_id:
        description: Workflow run containing the reviewed fixed three-release H2 seed bundle
        required: true
        type: string
      seed_bundle_sha256:
        description: SHA-256 of the reviewed H2 seed bundle artifact
        required: true
        type: string
      database_backup_artifact_id:
        description: Opaque external PITR set identity pinned by the hook after quiesce
        required: true
        type: string
      database_backup_artifact_sha256:
        description: SHA-256 of the frozen/PITR recovery set covering writes through quiesce
        required: true
        type: string
      database_recovery_hook_sha256:
        description: SHA-256 of the fixed remote verify-current-frozen/restore hook
        required: true
        type: string
      drain_deadline_seconds:
        description: Approved deadline for the one legacy report worker
        required: true
        type: string
      drain_stable_interval_seconds:
        description: Approved stable aggregate interval
        required: true
        type: string
      operation_timeout_seconds:
        description: Per opaque forward operation timeout (30-900 seconds)
        required: true
        type: string
      rollback_timeout_seconds:
        description: Per opaque rollback operation timeout (30-600 seconds)
        required: true
        type: string
      provider_mode:
        description: Preserve the existing production DataNewton state
        required: true
        type: choice
        options: [preserve]

permissions:
  contents: read
  actions: read

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  trusted-exact-legacy-guard:
    runs-on: ubuntu-24.04
    outputs:
      release_sha: ${{ steps.guard.outputs.release_sha }}
    steps:
      - name: Check out current protected main with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Prove trusted workflow and exact one-time identities
        id: guard
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          PRIOR_RELEASE_SHA: ${{ inputs.prior_release_sha }}
          PRIOR_IMAGE_CONFIG_SHA256: ${{ inputs.prior_product_image_config_sha256 }}
          PRIOR_COMPOSE_SHA256: ${{ inputs.prior_product_compose_sha256 }}
          PRIOR_NGINX_SHA256: ${{ inputs.prior_nginx_sha256 }}
          PRIOR_WEB_TREE_SHA256: ${{ inputs.prior_web_tree_sha256 }}
          SEED_RUN_ID: ${{ inputs.seed_bundle_run_id }}
          SEED_SHA256: ${{ inputs.seed_bundle_sha256 }}
          BACKUP_ARTIFACT_ID: ${{ inputs.database_backup_artifact_id }}
          BACKUP_SHA256: ${{ inputs.database_backup_artifact_sha256 }}
          RECOVERY_HOOK_SHA256: ${{ inputs.database_recovery_hook_sha256 }}
          DRAIN_DEADLINE_SECONDS: ${{ inputs.drain_deadline_seconds }}
          DRAIN_STABLE_INTERVAL_SECONDS: ${{ inputs.drain_stable_interval_seconds }}
          OPERATION_TIMEOUT_SECONDS: ${{ inputs.operation_timeout_seconds }}
          ROLLBACK_TIMEOUT_SECONDS: ${{ inputs.rollback_timeout_seconds }}
          PROVIDER_MODE: ${{ inputs.provider_mode }}
          ACTUAL_REPOSITORY: ${{ github.repository }}
          PROTECTED_REPOSITORY: ${{ vars.PROTECTED_REPOSITORY }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test -n "$PROTECTED_REPOSITORY"
          test "$ACTUAL_REPOSITORY" = "$PROTECTED_REPOSITORY"
          test "$WORKFLOW_REF" = "$ACTUAL_REPOSITORY/.github/workflows/deploy_prod_legacy_0015_bootstrap.yml@refs/heads/main"
          protected_main="$(git rev-parse HEAD)"
          test "$WORKFLOW_SHA" = "$protected_main"
          test "$PRIOR_RELEASE_SHA" = 6bee95e881a3e9ea1fe324ca13c11ae239f896f4
          test "$PROVIDER_MODE" = preserve
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SEED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SEED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BACKUP_ARTIFACT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$ ]]
          [[ "$BACKUP_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RECOVERY_HOOK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          for name in PRIOR_IMAGE_CONFIG_SHA256 PRIOR_COMPOSE_SHA256 PRIOR_NGINX_SHA256 PRIOR_WEB_TREE_SHA256; do
            [[ "${!name}" =~ ^[0-9a-f]{64}$ ]]
          done
          python - <<'PY'
          import math, os
          for name in ("DRAIN_DEADLINE_SECONDS", "DRAIN_STABLE_INTERVAL_SECONDS", "OPERATION_TIMEOUT_SECONDS", "ROLLBACK_TIMEOUT_SECONDS"):
              try:
                  value = float(os.environ[name])
              except ValueError as exc:
                  raise SystemExit(f"{name} invalid; STOP") from exc
              if not math.isfinite(value) or value <= 0:
                  raise SystemExit(f"{name} invalid; STOP")
          if float(os.environ["DRAIN_STABLE_INTERVAL_SECONDS"]) >= float(os.environ["DRAIN_DEADLINE_SECONDS"]):
              raise SystemExit("drain stable interval does not fit deadline; STOP")
          for name in ("OPERATION_TIMEOUT_SECONDS", "ROLLBACK_TIMEOUT_SECONDS"):
              value = float(os.environ[name])
              upper = 900 if name == "OPERATION_TIMEOUT_SECONDS" else 600
              if not value.is_integer() or not 30 <= value <= upper:
                  raise SystemExit(f"{name} is outside approved bounds; STOP")
          if float(os.environ["DRAIN_DEADLINE_SECONDS"]) + 30 > float(os.environ["OPERATION_TIMEOUT_SECONDS"]):
              raise SystemExit("drain deadline plus shutdown margin exceeds the forward operation bound; STOP")
          PY
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" "$protected_main"
          test "$(git rev-parse "$WORKFLOW_SHA:.github/workflows/deploy_prod_legacy_0015_bootstrap.yml")" = "$(git rev-parse "$protected_main:.github/workflows/deploy_prod_legacy_0015_bootstrap.yml")"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  qa:
    name: qa-required dependency
    needs: trusted-exact-legacy-guard
    uses: ./.github/workflows/qa.yml
    with:
      release_sha: ${{ needs.trusted-exact-legacy-guard.outputs.release_sha }}

  bootstrap:
    name: exact legacy-0015 protected production bootstrap
    needs: [trusted-exact-legacy-guard, qa]
    if: needs.qa.outputs.verified_release_sha == needs.trusted-exact-legacy-guard.outputs.release_sha
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check out exact QA release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.trusted-exact-legacy-guard.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up locked Python
        uses: ./.github/actions/setup-python-ci
        with:
          release-sha: ${{ needs.trusted-exact-legacy-guard.outputs.release_sha }}
      - name: Download sole build-once QA release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.qa.outputs.release_artifact_name }}
          path: .release/deploy
      - name: Download canonical QA attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.qa.outputs.attestation_artifact_name }}
          path: .release/deploy-attestation
      - name: Download explicit reviewed three-release H2 seed bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: company-public-h2-seed-bundle-e7478a2fba9aaca17829c3d99e89e8d83d4b3188
          path: .release/seed
          repository: ${{ github.repository }}
          run-id: ${{ inputs.seed_bundle_run_id }}
          github-token: ${{ github.token }}
      - name: Reverify QA release, attestation and reviewed seed bundle
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-exact-legacy-guard.outputs.release_sha }}
          VERIFIED_RELEASE_SHA: ${{ needs.qa.outputs.verified_release_sha }}
          SEED_SHA256: ${{ inputs.seed_bundle_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$VERIFIED_RELEASE_SHA" = "$RELEASE_SHA"
          cd .release/deploy
          sha256sum --strict --check "checksums-$RELEASE_SHA.txt"
          cd ../..
          python deploy/product_api/release_manifest.py "$PWD/.release/deploy" "$RELEASE_SHA"
          python - <<'PY'
          import json, os
          from hashlib import sha256
          from pathlib import Path
          release_sha = os.environ["RELEASE_SHA"]
          release_path = Path(".release/deploy") / f"release-manifest-{release_sha}.json"
          attestation_path = Path(".release/deploy-attestation") / f"qa-attestation-{release_sha}.json"
          attestation_raw = attestation_path.read_bytes()
          if attestation_raw.startswith(b"\xef\xbb\xbf") or b"\r" in attestation_raw or not attestation_raw.endswith(b"\n"):
              raise SystemExit("QA attestation bytes invalid; STOP")
          attestation = json.loads(attestation_raw.decode("utf-8"))
          if attestation_raw != (json.dumps(attestation, separators=(",", ":"), sort_keys=True) + "\n").encode():
              raise SystemExit("QA attestation is not canonical; STOP")
          if attestation.get("schema_version") != "company_card_v2_qa_attestation_v1" or attestation.get("verified_release_sha") != release_sha:
              raise SystemExit("QA attestation identity mismatch; STOP")
          if attestation.get("release_artifact_name") != f"qa-release-{release_sha}" or attestation.get("release_manifest_name") != release_path.name:
              raise SystemExit("QA artifact identity mismatch; STOP")
          if attestation.get("release_manifest_sha256") != sha256(release_path.read_bytes()).hexdigest():
              raise SystemExit("QA release manifest digest mismatch; STOP")
          jobs = attestation.get("job_conclusions")
          if not isinstance(jobs, dict) or set(jobs) != {"UNIT_RESULT", "POSTGRES_RESULT", "WEB_RESULT", "BUILD_RESULT", "BROWSER_RESULT", "CONTRACT_RESULT"} or set(jobs.values()) != {"success"}:
              raise SystemExit("QA attestation is not wholly successful; STOP")
          PY
          seed=.release/seed/company-public-h2-seed-bundle-e7478a2fba9aaca17829c3d99e89e8d83d4b3188.tgz
          test -f "$seed" && test ! -L "$seed"
          test "$(sha256sum "$seed" | cut -d' ' -f1)" = "$SEED_SHA256"
          python - <<'PY'
          from pathlib import PurePosixPath, Path
          import tarfile
          archive = Path('.release/seed/company-public-h2-seed-bundle-e7478a2fba9aaca17829c3d99e89e8d83d4b3188.tgz')
          with tarfile.open(archive, 'r:gz') as bundle:
              members = bundle.getmembers()
              if not members or len(members) > 10000 or sum(item.size for item in members) > 256 * 1024 * 1024:
                  raise SystemExit('seed archive bounds invalid; STOP')
              for item in members:
                  path = PurePosixPath(item.name)
                  if path.is_absolute() or not path.parts or path.parts[0] != 'seed-bundle' or any(part in {'', '.', '..'} for part in path.parts) or not (item.isfile() or item.isdir()):
                      raise SystemExit('seed archive member invalid; STOP')
          PY
          install -d -m 750 .release/seed/extracted
          tar -xzf "$seed" --no-same-owner --no-same-permissions -C .release/seed/extracted
          python deploy/nginx/company_public_h2_seed.py verify-bundle .release/seed/extracted/seed-bundle/seed-inventory.json >/dev/null

      - name: Configure strict RU SSH identity
        shell: bash
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          RU_SSH_KNOWN_HOSTS: ${{ secrets.RU_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PROD_SSH_KEY" && test -n "$RU_SSH_KNOWN_HOSTS"
          install -m 700 -d "$RUNNER_TEMP/legacy-0015-ssh"
          printf '%s\n' "$RU_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/legacy-0015-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/legacy-0015-ssh/known_hosts"
          eval "$(ssh-agent -s)"
          printf '%s\n' "$PROD_SSH_KEY" | ssh-add - >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Exact read-only legacy-0015 preflight and external recovery verification
        id: legacy
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-exact-legacy-guard.outputs.release_sha }}
          PRIOR_RELEASE_SHA: ${{ inputs.prior_release_sha }}
          PRIOR_IMAGE_CONFIG_SHA256: ${{ inputs.prior_product_image_config_sha256 }}
          PRIOR_COMPOSE_SHA256: ${{ inputs.prior_product_compose_sha256 }}
          PRIOR_NGINX_SHA256: ${{ inputs.prior_nginx_sha256 }}
          PRIOR_WEB_TREE_SHA256: ${{ inputs.prior_web_tree_sha256 }}
          RU_TARGET: ${{ secrets.RU_DEPLOY_TARGET }}
          RU_RELEASE_ROOT: ${{ vars.RU_RELEASE_ROOT }}
          RECOVERY_HOOK: ${{ vars.RU_LEGACY_0015_DB_RECOVERY_HOOK }}
          BACKUP_ARTIFACT: ${{ vars.RU_LEGACY_0015_DB_BACKUP_ARTIFACT }}
          BACKUP_ARTIFACT_ID: ${{ inputs.database_backup_artifact_id }}
          BACKUP_SHA256: ${{ inputs.database_backup_artifact_sha256 }}
          RECOVERY_HOOK_SHA256: ${{ inputs.database_recovery_hook_sha256 }}
          OPERATION_TIMEOUT_SECONDS: ${{ inputs.operation_timeout_seconds }}
          ROLLBACK_TIMEOUT_SECONDS: ${{ inputs.rollback_timeout_seconds }}
        run: |
          set -euo pipefail
          [[ "$RU_TARGET" =~ ^[A-Za-z0-9._-]+@[A-Za-z0-9.-]+$ ]]
          [[ "$RU_RELEASE_ROOT" =~ ^/[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9][A-Za-z0-9._-]*){2,}$ ]]
          [[ "$RECOVERY_HOOK" =~ ^/[A-Za-z0-9][A-Za-z0-9._/-]+$ ]]
          [[ "$BACKUP_ARTIFACT" =~ ^/[A-Za-z0-9][A-Za-z0-9._/-]+$ ]]
          stage="$RU_RELEASE_ROOT/$RELEASE_SHA-legacy-0015-bootstrap"
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/legacy-0015-ssh/known_hosts")
          ssh "${ssh_args[@]}" "$RU_TARGET" bash -s -- "$stage" "$RU_RELEASE_ROOT" "$RELEASE_SHA" "$PRIOR_RELEASE_SHA" "$PRIOR_IMAGE_CONFIG_SHA256" "$PRIOR_COMPOSE_SHA256" "$PRIOR_NGINX_SHA256" "$PRIOR_WEB_TREE_SHA256" "$RECOVERY_HOOK" "$BACKUP_ARTIFACT" "$BACKUP_ARTIFACT_ID" "$BACKUP_SHA256" "$RECOVERY_HOOK_SHA256" "$OPERATION_TIMEOUT_SECONDS" "$ROLLBACK_TIMEOUT_SECONDS" <<'REMOTE'
          set -euo pipefail
          stage=$1
          RU_RELEASE_ROOT=$2
          RELEASE_SHA=$3
          PRIOR_RELEASE_SHA=$4
          PRIOR_IMAGE_CONFIG_SHA256=$5
          PRIOR_COMPOSE_SHA256=$6
          PRIOR_NGINX_SHA256=$7
          PRIOR_WEB_TREE_SHA256=$8
          RECOVERY_HOOK=$9
          BACKUP_ARTIFACT=${10}
          BACKUP_ARTIFACT_ID=${11}
          BACKUP_SHA256=${12}
          RECOVERY_HOOK_SHA256=${13}
          OPERATION_TIMEOUT_SECONDS=${14}
          ROLLBACK_TIMEOUT_SECONDS=${15}
          command -v systemctl >/dev/null
          state_root=/var/lib/pork/deploy-state
          active="$state_root/fresh-install-active.json"
          success="$state_root/fresh-install-success.json"
          test ! -e "$active" && test ! -L "$active"
          test ! -e "$success" && test ! -L "$success"
          mapfile -t recovery_units < <(
            {
              systemctl list-units --all --type=service --full --no-legend --no-pager 'pork-production-fresh-install-*.service'
              systemctl list-unit-files --type=service --full --no-legend --no-pager 'pork-production-fresh-install-*.service'
            } | awk 'NF {print $1}' | sort -u
          )
          if test "${#recovery_units[@]}" -ne 0; then
            echo 'a production fresh-install recovery unit remains installed; STOP' >&2
            exit 2
          fi
          test -d "$RU_RELEASE_ROOT" && test ! -L "$RU_RELEASE_ROOT"
          stage_identity="$RELEASE_SHA:$PRIOR_RELEASE_SHA:$PRIOR_IMAGE_CONFIG_SHA256:$PRIOR_COMPOSE_SHA256:$PRIOR_NGINX_SHA256:$PRIOR_WEB_TREE_SHA256"
          if test -e "$stage" || test -L "$stage"; then
            test -d "$stage" && test ! -L "$stage"
            test "$(cat "$stage/bootstrap-stage-identity")" = "$stage_identity"
          else
            install -d -m 750 "$stage"
            printf '%s\n' "$stage_identity" > "$stage/bootstrap-stage-identity"
          fi
          if test -e "$stage/bootstrap-success" || test -L "$stage/bootstrap-success"; then
            test -f "$stage/bootstrap-success" && test ! -L "$stage/bootstrap-success"
            test "$(cat "$stage/bootstrap-success")" = "$RELEASE_SHA"
            echo 'one-time bootstrap already succeeded; repeat execution is forbidden; STOP' >&2
            exit 2
          fi
          rolled_back_retry=false
          if test -e "$stage/rollback-complete" || test -L "$stage/rollback-complete"; then
            test -f "$stage/rollback-complete" && test ! -L "$stage/rollback-complete"
            test "$(cat "$stage/rollback-complete")" = "$RELEASE_SHA"
            rolled_back_retry=true
          fi
          command -v flock >/dev/null
          command -v timeout >/dev/null
          command -v systemctl >/dev/null
          command -v sync >/dev/null
          command -v getent >/dev/null
          command -v ps >/dev/null
          command -v runuser >/dev/null
          test "$(id -u)" -eq 0
          nginx_group=$(getent group www-data)
          test "$(printf '%s\n' "$nginx_group" | cut -d: -f1)" = www-data
          [[ "$(printf '%s\n' "$nginx_group" | cut -d: -f3)" =~ ^[1-9][0-9]*$ ]]
          nginx_user=$(nginx -T 2>/dev/null | awk '$1 == "user" && NF == 2 { value=$2; sub(/;$/, "", value); print value }')
          test "$nginx_user" = www-data
          nginx_workers=$(ps -C nginx -o user=,group= | awk '$1 != "root" {print $1 ":" $2}' | sort -u)
          test "$nginx_workers" = www-data:www-data
          test -z "$(systemctl list-units --type=service --state=running,activating,reloading --plain --no-legend 'pork-legacy-0015-bootstrap-*' | awk 'NF {print $1; exit}')"
          product_id=$(docker compose -f /opt/b2b/docker-compose.product.yml --env-file /opt/b2b/.env.product ps -q product_api)
          report_id=$(docker compose -f /opt/b2b/docker-compose.product.yml --env-file /opt/b2b/.env.product ps -q company_report_worker)
          test -n "$product_id" && test -n "$report_id"
          global_product_output=$(docker ps -q --filter label=com.docker.compose.service=product_api)
          global_report_output=$(docker ps -q --filter label=com.docker.compose.service=company_report_worker)
          global_narrative_output=$(docker ps -q --filter label=com.docker.compose.service=company_card_narrative_worker)
          global_product_ids=()
          global_report_ids=()
          global_narrative_ids=()
          test -z "$global_product_output" || mapfile -t global_product_ids <<< "$global_product_output"
          test -z "$global_report_output" || mapfile -t global_report_ids <<< "$global_report_output"
          test -z "$global_narrative_output" || mapfile -t global_narrative_ids <<< "$global_narrative_output"
          test "${#global_product_ids[@]}" -eq 1
          test "${#global_report_ids[@]}" -eq 1
          test "${#global_narrative_ids[@]}" -eq 0
          test "${global_product_ids[0]}" = "$product_id"
          test "${global_report_ids[0]}" = "$report_id"
          project=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$product_id")
          printf '%s\n' "$project" | grep -Eq '^[a-z0-9][a-z0-9_-]*$'
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$product_id")" = product_api
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$report_id")" = "$project"
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$report_id")" = company_report_worker
          test "$(docker inspect --format '{{.Config.Image}}' "$product_id")" = "b2b-product-api:$PRIOR_RELEASE_SHA"
          test "$(docker inspect --format '{{.Config.Image}}' "$report_id")" = "b2b-product-api:$PRIOR_RELEASE_SHA"
          old_image=$(docker inspect --format '{{.Image}}' "$product_id")
          test "$old_image" = "sha256:$PRIOR_IMAGE_CONFIG_SHA256"
          test "$(docker inspect --format '{{.Image}}' "$report_id")" = "$old_image"
          test "$(sha256sum /opt/b2b/docker-compose.product.yml | cut -d' ' -f1)" = "$PRIOR_COMPOSE_SHA256"
          test "$(sha256sum /etc/nginx/sites-available/pork.su.conf | cut -d' ' -f1)" = "$PRIOR_NGINX_SHA256"
          legacy_web_tree_sha256=$(python3 - /opt/b2b/services/web_ui/dist <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import os
          import stat
          import sys

          root = Path(sys.argv[1])
          if root.is_symlink() or not root.is_dir():
              raise SystemExit("legacy Web root invalid; STOP")
          digest = sha256()
          count = 0
          total = 0
          observed_index = False
          for current_root, directory_names, file_names in os.walk(root, followlinks=False):
              directory_names.sort()
              file_names.sort()
              current = Path(current_root)
              for name in directory_names:
                  path = current / name
                  if path.is_symlink() or not path.is_dir():
                      raise SystemExit("legacy Web tree contains linked/non-directory entry; STOP")
              for name in file_names:
                  path = current / name
                  metadata = path.stat(follow_symlinks=False)
                  if path.is_symlink() or not stat.S_ISREG(metadata.st_mode):
                      raise SystemExit("legacy Web tree contains linked/non-file entry; STOP")
                  relative = path.relative_to(root).as_posix()
                  encoded = relative.encode("utf-8")
                  if not encoded or len(encoded) > 4096:
                      raise SystemExit("legacy Web path invalid; STOP")
                  file_digest = sha256()
                  with path.open("rb") as handle:
                      for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                          file_digest.update(chunk)
                  count += 1
                  total += metadata.st_size
                  if count > 10000 or total > 256 * 1024 * 1024:
                      raise SystemExit("legacy Web tree bounds invalid; STOP")
                  observed_index = observed_index or relative == "index.html"
                  digest.update(b"F")
                  digest.update(len(encoded).to_bytes(4, "big"))
                  digest.update(encoded)
                  digest.update(metadata.st_size.to_bytes(8, "big"))
                  digest.update(file_digest.digest())
          if not observed_index or count == 0:
              raise SystemExit("legacy Web index missing; STOP")
          print(digest.hexdigest())
          PY
          )
          test "$legacy_web_tree_sha256" = "$PRIOR_WEB_TREE_SHA256"
          test "$(docker inspect --format '{{.State.Running}}' "$product_id")" = true
          test "$(docker inspect --format '{{.State.Running}}' "$report_id")" = true
          test "$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$product_id")" = unless-stopped
          test "$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$report_id")" = unless-stopped
          test "$(docker port "$product_id" 8000/tcp)" = "127.0.0.1:8000"
          test -z "$(docker ps -aq --filter label=com.docker.compose.project="$project" --filter label=com.docker.compose.service=company_card_narrative_worker)"
          legacy_revision=$(docker exec -w /app/services/product_api "$product_id" python -m alembic -c alembic.ini current)

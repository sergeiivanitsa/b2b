      - name: Reset only exact stale retry markers after guarded preflight
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-exact-legacy-guard.outputs.release_sha }}
          RU_TARGET: ${{ secrets.RU_DEPLOY_TARGET }}
          RU_STAGE: ${{ steps.legacy.outputs.ru_stage }}
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/legacy-0015-ssh/known_hosts")
          ssh "${ssh_args[@]}" "$RU_TARGET" bash -s -- "$RU_STAGE" "$RELEASE_SHA" <<'REMOTE'
          set -euo pipefail
          stage=$1
          release_sha=$2
          success="$stage/bootstrap-success"
          if test -e "$success" || test -L "$success"; then
            test -f "$success" && test ! -L "$success"
            test "$(cat "$success")" = "$release_sha"
            echo 'one-time bootstrap already succeeded; repeat execution is forbidden; STOP' >&2
            exit 2
          fi
          rolled_back=false
          rollback_complete="$stage/rollback-complete"
          if test -e "$rollback_complete" || test -L "$rollback_complete"; then
            test -f "$rollback_complete" && test ! -L "$rollback_complete"
            test "$(cat "$rollback_complete")" = "$release_sha"
            rolled_back=true
          fi
          for name in bridge-armed bridge-complete drain-armed drain-complete migration-armed product-complete web-armed rollback-failed; do
            path="$stage/$name"
            if test -e "$path" || test -L "$path"; then
              test -f "$path" && test ! -L "$path"
              test "$(cat "$path")" = "$release_sha"
              test "$rolled_back" = true
            fi
          done
          drain_result="$stage/legacy-worker-drain-result.json"
          if test -e "$drain_result" || test -L "$drain_result"; then
            test -f "$drain_result" && test ! -L "$drain_result"
            test "$rolled_back" = true
          fi
          for name in bridge-armed bridge-complete drain-armed drain-complete migration-armed product-complete web-armed rollback-failed legacy-worker-drain-result.json; do
            path="$stage/$name"
            if test -e "$path" || test -L "$path"; then
              unlink "$path"
            fi
          done
          sync -f "$stage"
          if test -e "$rollback_complete" || test -L "$rollback_complete"; then
            unlink "$rollback_complete"
            sync -f "$stage"
          fi
          REMOTE

      - name: Upload exact candidate, reviewed seed and bootstrap tools
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-exact-legacy-guard.outputs.release_sha }}
          RU_TARGET: ${{ secrets.RU_DEPLOY_TARGET }}
          RU_STAGE: ${{ steps.legacy.outputs.ru_stage }}
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/legacy-0015-ssh/known_hosts")
          tool_manifest="$RUNNER_TEMP/legacy-bootstrap-tools-$RELEASE_SHA.sha256"
          : > "$tool_manifest"
          for source in \
            deploy/nginx/company_public_h2_release.py \
            deploy/nginx/company_public_h2_seed.py \
            deploy/nginx/seed_company_public_h2_assets.sh \
            deploy/nginx/install_company_public_h2_assets.sh \
            deploy/nginx/product_api_legacy_0015_h2_bootstrap.conf \
            deploy/nginx/product_api.conf \
            deploy/product_api/legacy_0015_worker_drain.py \
            deploy/product_api/legacy_0015_bootstrap_runner.sh \
            deploy/web_ui/install_web_ui_release.sh \
            docker-compose.product.yml; do
            digest=$(sha256sum "$source" | cut -d' ' -f1)
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            printf '%s  %s\n' "$digest" "${source##*/}" >> "$tool_manifest"
          done
          scp "${ssh_args[@]}" \
            ".release/deploy/product-api-$RELEASE_SHA.oci.tar" \
            ".release/deploy/company-public-h2-$RELEASE_SHA.tgz" \
            ".release/deploy/web-ui-$RELEASE_SHA.tgz" \
            ".release/deploy/release-manifest-$RELEASE_SHA.json" \
            ".release/deploy/checksums-$RELEASE_SHA.txt" \
            .release/seed/company-public-h2-seed-bundle-e7478a2fba9aaca17829c3d99e89e8d83d4b3188.tgz \
            deploy/nginx/company_public_h2_release.py \
            deploy/nginx/company_public_h2_seed.py \
            deploy/nginx/seed_company_public_h2_assets.sh \
            deploy/nginx/install_company_public_h2_assets.sh \
            deploy/nginx/product_api_legacy_0015_h2_bootstrap.conf \
            deploy/nginx/product_api.conf \
            deploy/product_api/legacy_0015_worker_drain.py \
            deploy/product_api/legacy_0015_bootstrap_runner.sh \
            deploy/web_ui/install_web_ui_release.sh \
            docker-compose.product.yml \
            "$tool_manifest" \
            "$RU_TARGET:$RU_STAGE/"

      - name: Offline verify bootstrap candidate provider preservation before live mutation
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-exact-legacy-guard.outputs.release_sha }}
          RU_TARGET: ${{ secrets.RU_DEPLOY_TARGET }}
          RU_STAGE: ${{ steps.legacy.outputs.ru_stage }}
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/legacy-0015-ssh/known_hosts")
          ssh "${ssh_args[@]}" "$RU_TARGET" "set -euo pipefail; cd '$RU_STAGE'; sha256sum --strict --ignore-missing --check 'checksums-$RELEASE_SHA.txt'; provider_state=\$(cat prior-provider-state); test \"\$provider_state\" = enabled -o \"\$provider_state\" = disabled; docker load --input 'product-api-$RELEASE_SHA.oci.tar' >/dev/null; expected_image=\$(python3 -c \"import json,re,sys; value=json.load(open(sys.argv[1],encoding='utf-8')); digest=value['images'][sys.argv[2]]['config_digest']; (isinstance(digest,str) and re.fullmatch(r'sha256:[0-9a-f]{64}',digest)) or sys.exit('invalid Product config digest'); print(digest)\" 'release-manifest-$RELEASE_SHA.json' 'product-api-$RELEASE_SHA.oci.tar'); candidate_image=\$(docker image inspect --format '{{.Id}}' 'b2b-product-api:$RELEASE_SHA'); test \"\$candidate_image\" = \"\$expected_image\"; docker run --rm --network none --env-file /opt/b2b/.env.product --env EXPECTED_PROVIDER_STATE=\"\$provider_state\" --env PRODUCT_RELEASE_COMMIT='$RELEASE_SHA' 'b2b-product-api:$RELEASE_SHA' python -c \"import os,sys; from product_api.settings import get_settings; s=get_settings(); actual='enabled' if s.datanewton_enabled else 'disabled'; key_ok=actual != 'enabled' or bool((s.datanewton_api_key or '').strip()); checks=(os.environ.get('PRODUCT_RELEASE_COMMIT') == '$RELEASE_SHA',actual == os.environ.get('EXPECTED_PROVIDER_STATE'),key_ok,not s.company_card_v2_presentations_enabled,not s.company_card_v2_writer_enabled,s.company_card_v2_rollout_generation == 0,s.company_card_v2_allowlist_inns == [],s.company_card_v2_percentage_basis_points == 0,not s.company_card_v2_arbitration_collection_enabled,s.company_card_v2_arbitration_mask_active_key_id is None,s.company_card_v2_arbitration_mask_keyring_json is None,not s.company_card_v2_narrative_enabled,s.company_card_v2_narrative_kill_switch,s.company_card_v2_narrative_daily_limit == 0,s.company_card_v2_narrative_monthly_limit == 0,s.company_card_v2_narrative_concurrency == 0); all(checks) or sys.exit('bootstrap candidate provider/default-off preflight failed')\""

      - name: Launch one durable remote bootstrap transaction
        id: durable
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-exact-legacy-guard.outputs.release_sha }}
          PRIOR_RELEASE_SHA: ${{ inputs.prior_release_sha }}
          SEED_SHA256: ${{ inputs.seed_bundle_sha256 }}
          RU_TARGET: ${{ secrets.RU_DEPLOY_TARGET }}
          RU_STAGE: ${{ steps.legacy.outputs.ru_stage }}
          RECOVERY_HOOK: ${{ vars.RU_LEGACY_0015_DB_RECOVERY_HOOK }}
          BACKUP_ARTIFACT: ${{ vars.RU_LEGACY_0015_DB_BACKUP_ARTIFACT }}
          BACKUP_ARTIFACT_ID: ${{ inputs.database_backup_artifact_id }}
          BACKUP_SHA256: ${{ inputs.database_backup_artifact_sha256 }}
          RECOVERY_HOOK_SHA256: ${{ inputs.database_recovery_hook_sha256 }}
          DRAIN_DEADLINE_SECONDS: ${{ inputs.drain_deadline_seconds }}
          DRAIN_STABLE_INTERVAL_SECONDS: ${{ inputs.drain_stable_interval_seconds }}
          OPERATION_TIMEOUT_SECONDS: ${{ inputs.operation_timeout_seconds }}
          ROLLBACK_TIMEOUT_SECONDS: ${{ inputs.rollback_timeout_seconds }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          unit="pork-legacy-0015-bootstrap-${RELEASE_SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$unit" =~ ^[a-z0-9-]+$ ]]
          runner_sha="$(sha256sum deploy/product_api/legacy_0015_bootstrap_runner.sh | cut -d' ' -f1)"
          [[ "$runner_sha" =~ ^[0-9a-f]{64}$ ]]
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/legacy-0015-ssh/known_hosts")
          ssh "${ssh_args[@]}" "$RU_TARGET" bash -s -- "$unit" "$RU_STAGE" "$runner_sha" "$RELEASE_SHA" "$PRIOR_RELEASE_SHA" "$RECOVERY_HOOK" "$BACKUP_ARTIFACT" "$BACKUP_ARTIFACT_ID" "$BACKUP_SHA256" "$RECOVERY_HOOK_SHA256" "$DRAIN_DEADLINE_SECONDS" "$DRAIN_STABLE_INTERVAL_SECONDS" "$SEED_SHA256" "$OPERATION_TIMEOUT_SECONDS" "$ROLLBACK_TIMEOUT_SECONDS" <<'REMOTE'
          set -euo pipefail
          unit=$1
          stage=$2
          runner_sha=$3
          shift 3
          release_sha=$1
          prior_release_sha=$2
          recovery_hook=$3
          backup_artifact=$4
          backup_id=$5
          backup_sha256=$6
          recovery_hook_sha256=$7
          drain_deadline=$8
          stable_interval=$9
          seed_sha256=${10}
          operation_timeout=${11}
          rollback_timeout=${12}
          test "$(stat -c '%u:%a' -- "$stage")" = "0:750"
          test "$(sha256sum "$stage/legacy_0015_bootstrap_runner.sh" | cut -d' ' -f1)" = "$runner_sha"
          cd "$stage"
          tool_manifest="legacy-bootstrap-tools-$release_sha.sha256"
          test -f "$tool_manifest" && test ! -L "$tool_manifest"
          sha256sum --strict --check "$tool_manifest"
          for name in \
            bootstrap-stage-identity \
            prior-product-id \
            prior-report-id \
            prior-product-image-id \
            prior-product-compose-project \
            prior-provider-state \
            prior-web-tree-sha256 \
            prior-docker-compose.product.yml \
            prior-nginx.conf \
            "product-api-$release_sha.oci.tar" \
            "company-public-h2-$release_sha.tgz" \
            "web-ui-$release_sha.tgz" \
            "release-manifest-$release_sha.json" \
            "checksums-$release_sha.txt" \
            company-public-h2-seed-bundle-e7478a2fba9aaca17829c3d99e89e8d83d4b3188.tgz \
            "$tool_manifest" \
            company_public_h2_release.py \
            company_public_h2_seed.py \
            seed_company_public_h2_assets.sh \
            install_company_public_h2_assets.sh \
            product_api_legacy_0015_h2_bootstrap.conf \
            product_api.conf \
            legacy_0015_worker_drain.py \
            legacy_0015_bootstrap_runner.sh \
            install_web_ui_release.sh \
            docker-compose.product.yml; do
            test -f "$stage/$name" && test ! -L "$stage/$name"
            chmod 640 "$stage/$name"
            sync -f "$stage/$name"
          done
          chmod 750 "$stage/legacy_0015_bootstrap_runner.sh"
          sync -f "$stage/legacy_0015_bootstrap_runner.sh"
          test -f "$recovery_hook" && test ! -L "$recovery_hook"
          test -f "$backup_artifact" && test ! -L "$backup_artifact"
          sync -f "$recovery_hook"
          sync -f "$backup_artifact"
          sync -f "$stage"
          unit_path="/etc/systemd/system/$unit.service"
          unit_temporary="/etc/systemd/system/.$unit.$$.tmp"
          test ! -e "$unit_temporary" && test ! -L "$unit_temporary"
          {
            printf '%s\n' '[Unit]' 'Description=One-time exact legacy-0015 production bootstrap with boot recovery' 'After=docker.service network-online.target' 'Wants=network-online.target' 'Requires=docker.service' 'StartLimitIntervalSec=0' '' '[Service]' 'Type=exec' 'User=root' 'Group=www-data' "WorkingDirectory=$stage" 'UMask=0027' 'Restart=on-failure' 'RestartSec=30' 'KillMode=control-group' 'KillSignal=SIGTERM' 'RuntimeMaxSec=7200' 'TimeoutStopSec=3600' 'SendSIGKILL=yes' 'NoNewPrivileges=yes' 'PrivateTmp=yes' 'StandardOutput=journal' 'StandardError=journal'
            printf 'ExecStart=/bin/bash %s %s %s %s %s %s %s %s %s %s %s %s %s %s %s\n' "$stage/legacy_0015_bootstrap_runner.sh" "$stage" "$release_sha" "$prior_release_sha" "$recovery_hook" "$backup_artifact" "$backup_id" "$backup_sha256" "$recovery_hook_sha256" "$drain_deadline" "$stable_interval" "$seed_sha256" "$unit" "$operation_timeout" "$rollback_timeout"
            printf '%s\n' '' '[Install]' 'WantedBy=multi-user.target'
          } > "$unit_temporary"
          chmod 640 "$unit_temporary"
          sync -f "$unit_temporary"
          if test -e "$unit_path" || test -L "$unit_path"; then
            test -f "$unit_path" && test ! -L "$unit_path"
            test "$(stat -c '%u:%a' -- "$unit_path")" = "0:640"
            cmp -s "$unit_temporary" "$unit_path"
            unlink "$unit_temporary"
          else
            mv -T "$unit_temporary" "$unit_path"
          fi
          sync -f "$unit_path"
          sync -f /etc/systemd/system
          systemctl daemon-reload
          systemctl enable --now "$unit.service"
          test "$(systemctl show --property=LoadState --value "$unit.service")" = loaded
          REMOTE
          echo "unit=$unit" >> "$GITHUB_OUTPUT"
          echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Wait for durable bridge, drain, migration, Web and public checks
        id: bootstrap_success
        timeout-minutes: 190
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-exact-legacy-guard.outputs.release_sha }}
          RU_TARGET: ${{ secrets.RU_DEPLOY_TARGET }}
          RU_STAGE: ${{ steps.legacy.outputs.ru_stage }}
          UNIT: ${{ steps.durable.outputs.unit }}
        run: |
          set -euo pipefail
          [[ "$UNIT" =~ ^[a-z0-9-]+$ ]]
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/legacy-0015-ssh/known_hosts")
          for attempt in $(seq 1 2220); do
            outcome=$(ssh "${ssh_args[@]}" "$RU_TARGET" bash -s -- "$RU_STAGE" "$RELEASE_SHA" "$UNIT" <<'REMOTE'
          set -euo pipefail
          stage=$1
          release_sha=$2
          unit=$3
          for state in bootstrap-success rollback-complete rollback-failed; do
            path="$stage/$state"
            if test -e "$path"; then
              test -f "$path" && test ! -L "$path"
              test "$(cat "$path")" = "$release_sha"
              printf '%s\n' "$state"
              exit 0
            fi
          done
          if systemctl is-active --quiet "$unit.service"; then
            echo running
            exit 0
          fi
          echo 'durable bootstrap unit disappeared without a terminal marker; STOP' >&2
          exit 2
          REMOTE
          )
            case "$outcome" in
              bootstrap-success)
                echo "complete=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              rollback-complete)
                echo 'durable bootstrap failed and completed DB-first legacy rollback' >&2
                exit 1
                ;;
              rollback-failed)
                echo 'durable bootstrap rollback failed; maintenance ingress remains; STOP' >&2
                exit 1
                ;;
              running) sleep 5 ;;
              *) echo 'invalid durable bootstrap status; STOP' >&2; exit 2 ;;
            esac
          done
          echo 'durable bootstrap exceeded bounded forward plus rollback window; STOP' >&2
          exit 2

      - name: Observe durable DB-first rollback after any unsuccessful transaction
        if: always() && steps.durable.outputs.started == 'true' && steps.bootstrap_success.outputs.complete != 'true'
        timeout-minutes: 190
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-exact-legacy-guard.outputs.release_sha }}
          RU_TARGET: ${{ secrets.RU_DEPLOY_TARGET }}
          RU_STAGE: ${{ steps.legacy.outputs.ru_stage }}
          UNIT: ${{ steps.durable.outputs.unit }}
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/legacy-0015-ssh/known_hosts")
          for attempt in $(seq 1 2220); do
            outcome=$(ssh "${ssh_args[@]}" "$RU_TARGET" bash -s -- "$RU_STAGE" "$RELEASE_SHA" "$UNIT" <<'REMOTE'
          set -euo pipefail
          stage=$1
          release_sha=$2
          unit=$3
          for state in rollback-complete rollback-failed bootstrap-success; do
            path="$stage/$state"
            if test -e "$path"; then
              test -f "$path" && test ! -L "$path"
              test "$(cat "$path")" = "$release_sha"
              printf '%s\n' "$state"
              exit 0
            fi
          done
          systemctl is-active --quiet "$unit.service"
          echo running
          REMOTE
          )
            case "$outcome" in
              rollback-complete)
                echo 'durable DB-first rollback completed; bootstrap remains failed' >&2
                exit 1
                ;;
              rollback-failed)
                echo 'durable DB-first rollback failed; maintenance ingress remains; STOP' >&2
                exit 1
                ;;
              bootstrap-success) exit 0 ;;
              running) sleep 5 ;;
              *) echo 'invalid durable recovery status; STOP' >&2; exit 2 ;;
            esac
          done
          echo 'durable rollback exceeded its 3300-second state-machine bound; STOP' >&2
          exit 2

      - name: Stop local bootstrap credential agent
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SSH_AGENT_PID:-}"
          ssh-agent -k >/dev/null

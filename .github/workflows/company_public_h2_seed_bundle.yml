name: Company Public H2 reviewed seed bundle

on:
  workflow_dispatch:
    inputs:
      oldest_commit:
        description: Reviewed oldest release commit
        required: true
        default: cfbd37c02c99c569e47806337ed0306c9a722551
        type: string
      oldest_manifest_sha256:
        description: Reviewed oldest Product H2 manifest SHA-256
        required: true
        default: e48fa51389f5365f9fe445b0c49a0a2224103502a6b742ca1cb9bd705f63a6d6
        type: string
      middle_commit:
        description: Reviewed middle release commit
        required: true
        default: 867c0d21558dc8e73a0e55a42167b38ced6d6b67
        type: string
      middle_manifest_sha256:
        description: Reviewed middle Product H2 manifest SHA-256
        required: true
        default: 506b92be298a1e81d8550dad08c5ce4b5ece8fa3d163a78d286642ec75b4b060
        type: string
      newest_commit:
        description: Reviewed newest release commit
        required: true
        default: e7478a2fba9aaca17829c3d99e89e8d83d4b3188
        type: string
      newest_manifest_sha256:
        description: Reviewed newest Product H2 manifest SHA-256
        required: true
        default: 97a76daefbb73e1b78935916516fa093f3db5027e09ea44f52df6f63ac18222b
        type: string

permissions:
  contents: read

jobs:
  build-reviewed-seed:
    runs-on: ubuntu-24.04
    steps:
      - name: Reject any unreviewed identity
        shell: bash
        env:
          OLDEST_COMMIT: ${{ inputs.oldest_commit }}
          OLDEST_MANIFEST: ${{ inputs.oldest_manifest_sha256 }}
          MIDDLE_COMMIT: ${{ inputs.middle_commit }}
          MIDDLE_MANIFEST: ${{ inputs.middle_manifest_sha256 }}
          NEWEST_COMMIT: ${{ inputs.newest_commit }}
          NEWEST_MANIFEST: ${{ inputs.newest_manifest_sha256 }}
        run: |
          set -euo pipefail
          test "$OLDEST_COMMIT" = cfbd37c02c99c569e47806337ed0306c9a722551
          test "$OLDEST_MANIFEST" = e48fa51389f5365f9fe445b0c49a0a2224103502a6b742ca1cb9bd705f63a6d6
          test "$MIDDLE_COMMIT" = 867c0d21558dc8e73a0e55a42167b38ced6d6b67
          test "$MIDDLE_MANIFEST" = 506b92be298a1e81d8550dad08c5ce4b5ece8fa3d163a78d286642ec75b4b060
          test "$NEWEST_COMMIT" = e7478a2fba9aaca17829c3d99e89e8d83d4b3188
          test "$NEWEST_MANIFEST" = 97a76daefbb73e1b78935916516fa093f3db5027e09ea44f52df6f63ac18222b
      - name: Check out reviewed oldest release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cfbd37c02c99c569e47806337ed0306c9a722551
          path: source-oldest
          fetch-depth: 1
          persist-credentials: false
      - name: Check out reviewed middle release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 867c0d21558dc8e73a0e55a42167b38ced6d6b67
          path: source-middle
          fetch-depth: 1
          persist-credentials: false
      - name: Check out reviewed newest release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e7478a2fba9aaca17829c3d99e89e8d83d4b3188
          path: source-newest
          fetch-depth: 1
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.1
          check-latest: false
      - name: Build and verify each historical graph in isolation
        shell: bash
        run: |
          set -euo pipefail
          for pair in \
            "source-oldest:cfbd37c02c99c569e47806337ed0306c9a722551" \
            "source-middle:867c0d21558dc8e73a0e55a42167b38ced6d6b67" \
            "source-newest:e7478a2fba9aaca17829c3d99e89e8d83d4b3188"; do
            source="${pair%%:*}"
            commit="${pair##*:}"
            test "$(git -C "$source" rev-parse HEAD)" = "$commit"
            npm ci --no-audit --prefix "$source/services/web_ui"
            npm run build --prefix "$source/services/web_ui"
          done
          test "$(sha256sum source-oldest/services/product_api/src/product_api/company_reports/company_card_v2/public_h2_asset_manifest.json | cut -d' ' -f1)" = e48fa51389f5365f9fe445b0c49a0a2224103502a6b742ca1cb9bd705f63a6d6
          test "$(sha256sum source-middle/services/product_api/src/product_api/company_reports/company_card_v2/public_h2_asset_manifest.json | cut -d' ' -f1)" = 506b92be298a1e81d8550dad08c5ce4b5ece8fa3d163a78d286642ec75b4b060
          test "$(sha256sum source-newest/services/product_api/src/product_api/company_reports/company_card_v2/public_h2_asset_manifest.json | cut -d' ' -f1)" = 97a76daefbb73e1b78935916516fa093f3db5027e09ea44f52df6f63ac18222b
      - name: Assemble bounded canonical seed inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p seed-bundle/releases
          for pair in \
            "source-oldest:cfbd37c02c99c569e47806337ed0306c9a722551" \
            "source-middle:867c0d21558dc8e73a0e55a42167b38ced6d6b67" \
            "source-newest:e7478a2fba9aaca17829c3d99e89e8d83d4b3188"; do
            source="${pair%%:*}"
            commit="${pair##*:}"
            target="seed-bundle/releases/$commit"
            mkdir -p "$target/assets"
            cp "$source/services/product_api/src/product_api/company_reports/company_card_v2/public_h2_asset_manifest.json" "$target/public_h2_asset_manifest.json"
            cp "$source/services/web_ui/dist-company-public-h2/assets/"* "$target/assets/"
          done
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readdir, readFile, writeFile } from 'node:fs/promises'
          import { join, relative } from 'node:path'
          const releases = [
            { commit: 'cfbd37c02c99c569e47806337ed0306c9a722551', manifest_sha256: 'e48fa51389f5365f9fe445b0c49a0a2224103502a6b742ca1cb9bd705f63a6d6' },
            { commit: '867c0d21558dc8e73a0e55a42167b38ced6d6b67', manifest_sha256: '506b92be298a1e81d8550dad08c5ce4b5ece8fa3d163a78d286642ec75b4b060' },
            { commit: 'e7478a2fba9aaca17829c3d99e89e8d83d4b3188', manifest_sha256: '97a76daefbb73e1b78935916516fa093f3db5027e09ea44f52df6f63ac18222b' },
          ].map(item => ({ ...item, source_dir: `releases/${item.commit}` }))
          for (const release of releases) {
            const root = join('seed-bundle', release.source_dir)
            const manifestPath = join(root, 'public_h2_asset_manifest.json')
            const manifestBytes = await readFile(manifestPath)
            if (createHash('sha256').update(manifestBytes).digest('hex') !== release.manifest_sha256) {
              throw new Error('seed release manifest identity mismatch')
            }
            const manifest = JSON.parse(manifestBytes.toString('utf8'))
            if (manifest.schema_version !== 'company_public_h2_asset_manifest_v1' || !Array.isArray(manifest.assets) || manifest.assets.length === 0) {
              throw new Error('seed release manifest schema mismatch')
            }
            const expected = new Map()
            for (const asset of manifest.assets) {
              if (typeof asset?.path !== 'string' || !/^\/assets\/company-public-h2\.[A-Za-z0-9_-]{8,}\.(?:js|css)$/.test(asset.path) || !/^[0-9a-f]{64}$/.test(asset.sha256_hex)) {
                throw new Error('seed release asset identity mismatch')
              }
              const name = asset.path.slice('/assets/'.length)
              if (expected.has(name)) throw new Error('seed release asset duplicate')
              expected.set(name, asset.sha256_hex)
            }
            const entries = await readdir(join(root, 'assets'), { withFileTypes: true })
            if (entries.some(entry => !entry.isFile()) || entries.map(entry => entry.name).sort().join('\n') !== [...expected.keys()].sort().join('\n')) {
              throw new Error('seed release asset graph mismatch')
            }
            for (const [name, digest] of expected) {
              const bytes = await readFile(join(root, 'assets', name))
              if (createHash('sha256').update(bytes).digest('hex') !== digest) {
                throw new Error('seed release asset bytes mismatch')
              }
            }
          }
          const inventory = `${JSON.stringify({ schema_version: 'company_public_h2_seed_inventory_v1', releases })}\n`
          await writeFile('seed-bundle/seed-inventory.json', inventory)
          async function files(root) {
            const output = []
            for (const entry of await readdir(root, { withFileTypes: true })) {
              const path = join(root, entry.name)
              if (entry.isSymbolicLink()) throw new Error('seed bundle contains a symlink')
              if (entry.isDirectory()) output.push(...await files(path))
              else if (entry.isFile()) output.push(path)
              else throw new Error('seed bundle contains a non-file')
            }
            return output
          }
          const rows = []
          for (const path of (await files('seed-bundle')).sort()) {
            if (path.endsWith('seed-bundle-checksums.txt')) continue
            const bytes = await readFile(path)
            rows.push(`${createHash('sha256').update(bytes).digest('hex')}  ${relative('seed-bundle', path).replaceAll('\\', '/')}\n`)
          }
          await writeFile('seed-bundle/seed-bundle-checksums.txt', rows.join(''))
          NODE
          source_epoch="$(git -C source-newest show -s --format=%ct HEAD)"
          tar --sort=name --mtime="@$source_epoch" --owner=0 --group=0 --numeric-owner --format=posix --pax-option=delete=atime,delete=ctime -czf company-public-h2-seed-bundle-e7478a2fba9aaca17829c3d99e89e8d83d4b3188.tgz seed-bundle
      - name: Upload reviewed non-production seed bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: company-public-h2-seed-bundle-e7478a2fba9aaca17829c3d99e89e8d83d4b3188
          path: company-public-h2-seed-bundle-e7478a2fba9aaca17829c3d99e89e8d83d4b3188.tgz
          if-no-files-found: error
          retention-days: 14

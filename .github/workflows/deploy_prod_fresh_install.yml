            absent)
              test "${us[1]}" = b2b || { echo 'legacy Gateway Compose project changed; STOP' >&2; exit 2; }
              test "${us[2]}" = sha256:f3da3267549b92c04bcec89d0f9c6502b2a5b79c3652678471d2def0b90e3035 || { echo 'legacy Gateway image digest changed; STOP' >&2; exit 2; }
              test "${us[3]}" = - || { echo 'legacy Gateway unexpectedly exposes GATEWAY_RELEASE_COMMIT; STOP' >&2; exit 2; }
              test "${us[8]}" -eq 0 || { echo 'legacy Gateway unexpectedly defines GATEWAY_RELEASE_COMMIT; STOP' >&2; exit 2; }
              test "${us[4]}" = b2b-gateway_api || { echo 'legacy Gateway config image changed; STOP' >&2; exit 2; }
              test "${us[5]}" = /opt/b2b/docker-compose.gateway.yml || { echo 'legacy Gateway Compose config path changed; STOP' >&2; exit 2; }
              test "${us[6]}" = /opt/b2b || { echo 'legacy Gateway Compose working directory changed; STOP' >&2; exit 2; }
              test "${us[7]}" = /opt/b2b/.env.gateway || { echo 'legacy Gateway Compose environment file changed; STOP' >&2; exit 2; }
              ;;
            *) echo 'prior Gateway receipt state is invalid; STOP' >&2; exit 2 ;;
          esac
          echo "ru_stage=$RU_RELEASE_ROOT/$RELEASE_SHA-fresh-install" >> "$GITHUB_OUTPUT"
          echo "us_stage=$US_RELEASE_ROOT/$RELEASE_SHA-fresh-install" >> "$GITHUB_OUTPUT"

      - name: Stage exact release, seed and fresh-install tools
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-main.outputs.release_sha }}
          RU_TARGET: ${{ secrets.RU_DEPLOY_TARGET }}
          US_TARGET: ${{ secrets.US_DEPLOY_TARGET }}
          RU_STAGE: ${{ steps.preflight.outputs.ru_stage }}
          US_STAGE: ${{ steps.preflight.outputs.us_stage }}
          DATABASE_IDENTITY_SHA256: ${{ secrets.RU_DATABASE_IDENTITY_SHA256 }}
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/fresh-install-ssh/known_hosts")
          ssh "${ssh_args[@]}" "$RU_TARGET" bash -s <<'REMOTE'
          set -euo pipefail
          stop() { echo "$1; STOP" >&2; exit 2; }
          claims_parent=/var/lib/pork/claims-uploads
          claims_root=$claims_parent/v1
          test -d "$claims_parent" && test ! -L "$claims_parent" || stop "Claims parent changed before normalization"
          test "$(realpath -e -- "$claims_parent")" = "$claims_parent" || stop "Claims parent is not canonical before normalization"
          case "$(stat -c '%u:%g:%a' -- "$claims_parent")" in 0:0:755|0:0:750) ;; *) stop "Claims parent identity or mode changed before normalization" ;; esac
          test -d "$claims_root" && test ! -L "$claims_root" || stop "Claims root changed before normalization"
          test "$(realpath -e -- "$claims_root")" = "$claims_root" || stop "Claims root is not canonical before normalization"
          case "$(stat -c '%u:%g:%a' -- "$claims_root")" in 0:0:700|0:0:750) ;; *) stop "Claims root identity or mode changed before normalization" ;; esac
          unexpected_claims_entry=$(find "$claims_parent" -mindepth 1 -maxdepth 1 ! -path "$claims_root" -print -quit)
          first_claims_entry=$(find "$claims_root" -mindepth 1 -print -quit)
          test -z "$unexpected_claims_entry" || stop "Claims parent gained an unexpected entry before normalization"
          test -z "$first_claims_entry" || stop "Claims root is no longer empty before normalization"
          chmod 750 -- "$claims_parent" "$claims_root"
          sync -f "$claims_parent"
          sync -f "$claims_root"
          test "$(stat -c '%u:%g:%a' -- "$claims_parent")" = 0:0:750 || stop "Claims parent normalization failed"
          test "$(stat -c '%u:%g:%a' -- "$claims_root")" = 0:0:750 || stop "Claims root normalization failed"
          REMOTE
          ssh "${ssh_args[@]}" "$RU_TARGET" "set -euo pipefail; install -d -m 750 '$RU_STAGE'; identity='$RELEASE_SHA:production-fresh-install-v1'; if test -e '$RU_STAGE/stage-identity' || test -L '$RU_STAGE/stage-identity'; then test -f '$RU_STAGE/stage-identity' && test ! -L '$RU_STAGE/stage-identity' && test \"\$(cat '$RU_STAGE/stage-identity')\" = \"\$identity\"; else printf '%s\n' \"\$identity\" > '$RU_STAGE/.stage-identity.tmp'; chmod 640 '$RU_STAGE/.stage-identity.tmp'; sync -f '$RU_STAGE/.stage-identity.tmp'; mv -T '$RU_STAGE/.stage-identity.tmp' '$RU_STAGE/stage-identity'; sync -f '$RU_STAGE'; fi"
          ssh "${ssh_args[@]}" "$US_TARGET" "set -euo pipefail; install -d -m 750 '$US_STAGE'; identity='$RELEASE_SHA:production-fresh-install-v1'; if test -e '$US_STAGE/stage-identity' || test -L '$US_STAGE/stage-identity'; then test -f '$US_STAGE/stage-identity' && test ! -L '$US_STAGE/stage-identity' && test \"\$(cat '$US_STAGE/stage-identity')\" = \"\$identity\"; else printf '%s\n' \"\$identity\" > '$US_STAGE/.stage-identity.tmp'; chmod 640 '$US_STAGE/.stage-identity.tmp'; sync -f '$US_STAGE/.stage-identity.tmp'; mv -T '$US_STAGE/.stage-identity.tmp' '$US_STAGE/stage-identity'; sync -f '$US_STAGE'; fi"
          credential="/etc/pork/fresh-install-credentials/$RELEASE_SHA.database-identity.sha256"
          printf '%s\n' "$DATABASE_IDENTITY_SHA256" | ssh "${ssh_args[@]}" "$RU_TARGET" "set -euo pipefail; install -d -m 700 -o root -g root /etc/pork/fresh-install-credentials; temporary='$credential.tmp'; test ! -e \"\$temporary\" && test ! -L \"\$temporary\"; IFS= read -r value; printf '%s\n' \"\$value\" | grep -Eq '^[0-9a-f]{64}$'; printf '%s\n' \"\$value\" > \"\$temporary\"; chmod 600 \"\$temporary\"; sync -f \"\$temporary\"; if test -e '$credential' || test -L '$credential'; then test -f '$credential' && test ! -L '$credential' && cmp -s \"\$temporary\" '$credential'; unlink \"\$temporary\"; else mv -T \"\$temporary\" '$credential'; fi; sync -f '$credential'; sync -f /etc/pork/fresh-install-credentials"
          cp .release/seed/company-public-h2-seed-bundle-e7478a2fba9aaca17829c3d99e89e8d83d4b3188.tgz .release/preflight/
          cd .release/preflight
          mapfile -t ru < ru-topology.txt
          printf '%s\n' "${ru[2]}" > prior-product-compose-project
          printf '%s\n' "${ru[3]}" > prior-provider-state
          cp ../../deploy/product_api/fresh_install_database.py .
          cp ../../deploy/product_api/fresh_install_candidate.py .
          cp ../../deploy/product_api/fresh_install_runner.sh .
          cp ../../deploy/product_api/fresh_install_boot_guard.sh .
          cp ../../deploy/nginx/company_public_h2_release.py ../../deploy/nginx/company_public_h2_seed.py ../../deploy/nginx/install_company_public_h2_assets.sh ../../deploy/nginx/seed_company_public_h2_assets.sh ../../deploy/nginx/product_api_legacy_0015_h2_bootstrap.conf ../../deploy/nginx/product_api.conf ../../deploy/web_ui/install_web_ui_release.sh ../../docker-compose.product.yml .
          sha256sum database-preflight.json prior-product-compose-project prior-provider-state fresh_install_database.py fresh_install_candidate.py fresh_install_runner.sh fresh_install_boot_guard.sh company_public_h2_release.py company_public_h2_seed.py install_company_public_h2_assets.sh seed_company_public_h2_assets.sh product_api_legacy_0015_h2_bootstrap.conf product_api.conf install_web_ui_release.sh docker-compose.product.yml > "fresh-install-tools-$RELEASE_SHA.sha256"
          cd ../..
          scp "${ssh_args[@]}" .release/deploy/product-api-$RELEASE_SHA.oci.tar .release/deploy/company-public-h2-$RELEASE_SHA.tgz .release/deploy/web-ui-$RELEASE_SHA.tgz .release/deploy/release-manifest-$RELEASE_SHA.json .release/deploy/checksums-$RELEASE_SHA.txt .release/preflight/database-preflight.json .release/preflight/prior-product-compose-project .release/preflight/prior-provider-state .release/preflight/fresh_install_database.py .release/preflight/fresh_install_candidate.py .release/preflight/fresh_install_runner.sh .release/preflight/fresh_install_boot_guard.sh .release/preflight/company_public_h2_release.py .release/preflight/company_public_h2_seed.py .release/preflight/install_company_public_h2_assets.sh .release/preflight/seed_company_public_h2_assets.sh .release/preflight/product_api_legacy_0015_h2_bootstrap.conf .release/preflight/product_api.conf .release/preflight/install_web_ui_release.sh .release/preflight/docker-compose.product.yml .release/preflight/fresh-install-tools-$RELEASE_SHA.sha256 .release/preflight/company-public-h2-seed-bundle-e7478a2fba9aaca17829c3d99e89e8d83d4b3188.tgz "$RU_TARGET:$RU_STAGE/"
          scp "${ssh_args[@]}" .release/deploy/gateway-api-$RELEASE_SHA.oci.tar .release/deploy/release-manifest-$RELEASE_SHA.json .release/deploy/checksums-$RELEASE_SHA.txt deploy/us/compose/docker-compose.gateway.yml deploy/product_api/fresh_install_gateway_receipt.py "$US_TARGET:$US_STAGE/"
          gateway_receipt_sha=$(sha256sum deploy/product_api/fresh_install_gateway_receipt.py | cut -d' ' -f1)
          test "$(ssh "${ssh_args[@]}" "$US_TARGET" "set -euo pipefail; test -f '$US_STAGE/fresh_install_gateway_receipt.py' && test ! -L '$US_STAGE/fresh_install_gateway_receipt.py'; chmod 640 '$US_STAGE/fresh_install_gateway_receipt.py'; sha256sum '$US_STAGE/fresh_install_gateway_receipt.py' | cut -d' ' -f1")" = "$gateway_receipt_sha"

      - name: Arm reversible prior Gateway identity before candidate mutation
        id: gateway_arm
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-main.outputs.release_sha }}
          US_TARGET: ${{ secrets.US_DEPLOY_TARGET }}
          US_STAGE: ${{ steps.preflight.outputs.us_stage }}
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/fresh-install-ssh/known_hosts")
          ssh "${ssh_args[@]}" "$US_TARGET" bash -s -- "$US_STAGE" "$RELEASE_SHA" <<'REMOTE'
          set -euo pipefail
          stop() { echo "$1; STOP" >&2; exit 2; }
          stage=$1; release_sha=$2
          cd "$stage"
          test -f fresh_install_gateway_receipt.py && test ! -L fresh_install_gateway_receipt.py
          expected=$(python3 -c "import json,re,sys; value=json.load(open(sys.argv[1],encoding='utf-8')); digest=value['images'][sys.argv[2]]['config_digest']; (isinstance(digest,str) and re.fullmatch(r'sha256:[0-9a-f]{64}',digest)) or sys.exit(2); print(digest)" "release-manifest-$release_sha.json" "gateway-api-$release_sha.oci.tar")
          gateway_ids=$(docker ps -aq --filter label=com.docker.compose.service=gateway_api)
          mapfile -t ids < <(printf '%s' "$gateway_ids")
          test "${#ids[@]}" -eq 1 || stop "Gateway container cardinality changed before arming rollback"
          id=${ids[0]}
          test "$(docker inspect --format '{{.State.Running}}' "$id")" = true || stop "Gateway is not running before arming rollback"
          current_project=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$id")
          current_image=$(docker inspect --format '{{.Image}}' "$id")
          current_config_image=$(docker inspect --format '{{.Config.Image}}' "$id")
          current_config_files=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project.config_files"}}' "$id")
          current_working_dir=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$id")
          current_environment_file=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project.environment_file"}}' "$id")
          test "$current_project" = b2b || stop "Gateway Compose project changed before arming rollback"
          gateway_env=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$id")
          commit_count=$(printf '%s\n' "$gateway_env" | sed -n '/^GATEWAY_RELEASE_COMMIT=/p' | wc -l)
          test "$commit_count" -le 1
          current_commit=-
          if test "$commit_count" -eq 1; then
            commit_value=$(printf '%s\n' "$gateway_env" | sed -n 's/^GATEWAY_RELEASE_COMMIT=//p')
            if test -n "$commit_value"; then current_commit=$commit_value; printf '%s\n' "$current_commit" | grep -Eq '^[0-9a-f]{40}$'; fi
          fi
          receipt="$stage/prior-gateway.json"
          tag="b2b-gateway-api:fresh-install-prior-$release_sha"
          if test -e "$receipt" || test -L "$receipt"; then
            prior_payload=$(python3 fresh_install_gateway_receipt.py read "$receipt" "$release_sha")
            mapfile -t prior <<< "$prior_payload"
          else
            test "$current_image" = sha256:f3da3267549b92c04bcec89d0f9c6502b2a5b79c3652678471d2def0b90e3035 || stop "legacy Gateway image digest changed before arming rollback"
            test "$current_config_image" = b2b-gateway_api || stop "legacy Gateway config image changed before arming rollback"
            test "$current_config_files" = /opt/b2b/docker-compose.gateway.yml || stop "legacy Gateway Compose config path changed before arming rollback"
            test "$current_working_dir" = /opt/b2b || stop "legacy Gateway Compose working directory changed before arming rollback"
            test "$current_environment_file" = /opt/b2b/.env.gateway || stop "legacy Gateway Compose environment file changed before arming rollback"
            test "$current_commit" = - || stop "legacy Gateway unexpectedly exposes GATEWAY_RELEASE_COMMIT before arming rollback"
            test "$commit_count" -eq 0 || stop "legacy Gateway unexpectedly defines GATEWAY_RELEASE_COMMIT before arming rollback"
            test "$current_image" != "$expected"
            if docker image inspect "$tag" >/dev/null 2>&1; then
              test "$(docker image inspect --format '{{.Id}}' "$tag")" = "$current_image"
            else
              docker tag "$current_image" "$tag"
            fi
            prior_payload=$(python3 fresh_install_gateway_receipt.py write "$receipt" "$release_sha" "$current_project" "$current_image" "$current_commit")
            mapfile -t prior <<< "$prior_payload"
          fi
          test "${#prior[@]}" -eq 3
          test "$current_project" = "${prior[0]}"
          test "$(docker image inspect --format '{{.Id}}' "$tag")" = "${prior[1]}"
          if test "$current_image" = "${prior[1]}"; then
            test "$current_commit" = "${prior[2]}"
            if test "$current_config_image" = b2b-gateway_api; then
              test "$current_image" = sha256:f3da3267549b92c04bcec89d0f9c6502b2a5b79c3652678471d2def0b90e3035
              test "$current_commit" = -
              test "$current_config_files" = /opt/b2b/docker-compose.gateway.yml
              test "$current_working_dir" = /opt/b2b
              test "$current_environment_file" = /opt/b2b/.env.gateway
              test "$commit_count" -eq 0
            else
              test "$current_config_image" = "b2b-gateway-api:fresh-install-prior-$release_sha"
              test "$current_config_files" = "$stage/docker-compose.gateway.yml"
              test "$current_working_dir" = "$stage"
              test "$current_environment_file" = /opt/b2b/.env.gateway
              test "$commit_count" -eq 1
            fi
          elif test "$current_image" = "$expected"; then
            test "$current_commit" = "$release_sha"
            test "$current_config_image" = "b2b-gateway-api:$release_sha"
            test "$current_config_files" = "$stage/docker-compose.gateway.yml"
            test "$current_working_dir" = "$stage"
            test "$current_environment_file" = /opt/b2b/.env.gateway
            test "$commit_count" -eq 1
          else
            echo 'current Gateway is outside the immutable prior/candidate graph; STOP' >&2
            exit 2
          fi
          REMOTE
          echo "armed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy and verify same exact Gateway SHA before destructive boundary
        id: gateway
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-main.outputs.release_sha }}
          RU_TARGET: ${{ secrets.RU_DEPLOY_TARGET }}
          US_TARGET: ${{ secrets.US_DEPLOY_TARGET }}
          RU_STAGE: ${{ steps.preflight.outputs.ru_stage }}
          US_STAGE: ${{ steps.preflight.outputs.us_stage }}
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/fresh-install-ssh/known_hosts")
          gateway_image_id=$(ssh "${ssh_args[@]}" "$US_TARGET" bash -s -- "$US_STAGE" "$RELEASE_SHA" <<'REMOTE'
          set -euo pipefail
          stage=$1; release_sha=$2
          cd "$stage"
          prior_payload=$(python3 fresh_install_gateway_receipt.py read "$stage/prior-gateway.json" "$release_sha")
          mapfile -t prior <<< "$prior_payload"
          test "${#prior[@]}" -eq 3
          project=${prior[0]}
          test "$(docker image inspect --format '{{.Id}}' "b2b-gateway-api:fresh-install-prior-$release_sha")" = "${prior[1]}"
          sha256sum --strict --ignore-missing --check "checksums-$release_sha.txt" >/dev/null
          docker load --input "gateway-api-$release_sha.oci.tar" >/dev/null
          expected=$(python3 -c "import json,re,sys; value=json.load(open(sys.argv[1],encoding='utf-8')); digest=value['images'][sys.argv[2]]['config_digest']; (isinstance(digest,str) and re.fullmatch(r'sha256:[0-9a-f]{64}',digest)) or sys.exit(2); print(digest)" "release-manifest-$release_sha.json" "gateway-api-$release_sha.oci.tar")
          candidate=$(docker image inspect --format '{{.Id}}' "b2b-gateway-api:$release_sha")
          test "$candidate" = "$expected"
          cd /opt/b2b
          GATEWAY_ENV_FILE=/opt/b2b/.env.gateway GATEWAY_IMAGE_TAG="$release_sha" GATEWAY_RELEASE_COMMIT="$release_sha" docker compose -p "$project" -f "$stage/docker-compose.gateway.yml" --env-file .env.gateway up -d --no-build --force-recreate gateway_api >/dev/null
          id=$(GATEWAY_ENV_FILE=/opt/b2b/.env.gateway GATEWAY_IMAGE_TAG="$release_sha" GATEWAY_RELEASE_COMMIT="$release_sha" docker compose -p "$project" -f "$stage/docker-compose.gateway.yml" --env-file .env.gateway ps -q gateway_api)
          test -n "$id"
          test "$(docker ps -q --filter label=com.docker.compose.service=gateway_api | wc -l)" -eq 1
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$id")" = "$project"
          test "$(docker inspect --format '{{.Config.Image}}' "$id")" = "b2b-gateway-api:$release_sha"
          test "$(docker inspect --format '{{.Image}}' "$id")" = "$candidate"
          test "$(docker inspect --format '{{.State.Running}}' "$id")" = true
          test "$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$id")" = unless-stopped
          test "$(docker port "$id" 8001/tcp)" = 127.0.0.1:8001
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$id" | grep -Fx "GATEWAY_RELEASE_COMMIT=$release_sha" >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8001/health >/dev/null
          printf '%s\n' "$candidate"
          REMOTE
          )
          [[ "$gateway_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          legacy_product_id=$(ssh "${ssh_args[@]}" "$RU_TARGET" "docker compose -f /opt/b2b/docker-compose.product.yml --env-file /opt/b2b/.env.product ps -q product_api")
          [[ "$legacy_product_id" =~ ^[0-9a-f]{12,64}$ ]]
          ssh "${ssh_args[@]}" "$RU_TARGET" "docker exec -i '$legacy_product_id' python - gateway --release-sha '$RELEASE_SHA'" < deploy/product_api/fresh_install_candidate.py
          echo "image_id=$gateway_image_id" >> "$GITHUB_OUTPUT"
          echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Bind exact Gateway success to RU durable stage
        if: steps.gateway.outputs.complete == 'true'
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-main.outputs.release_sha }}
          GATEWAY_IMAGE_ID: ${{ steps.gateway.outputs.image_id }}
          RU_TARGET: ${{ secrets.RU_DEPLOY_TARGET }}
          RU_STAGE: ${{ steps.preflight.outputs.ru_stage }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          value = {
              'gateway_image_id': os.environ['GATEWAY_IMAGE_ID'],
              'phase': 'gateway-complete',
              'release_sha': os.environ['RELEASE_SHA'],
              'schema_version': 'production_fresh_install_gateway_v1',
          }
          open('.release/preflight/gateway-complete', 'w', encoding='utf-8', newline='\n').write(json.dumps(value, separators=(',', ':'), sort_keys=True) + '\n')
          PY
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/fresh-install-ssh/known_hosts")
          scp "${ssh_args[@]}" .release/preflight/gateway-complete "$RU_TARGET:$RU_STAGE/"
          ssh "${ssh_args[@]}" "$RU_TARGET" "chmod 640 '$RU_STAGE/gateway-complete'; sync -f '$RU_STAGE/gateway-complete'; sync -f '$RU_STAGE'"

      - name: Launch durable fail-closed fresh-install transaction
        id: durable
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-main.outputs.release_sha }}
          RU_TARGET: ${{ secrets.RU_DEPLOY_TARGET }}
          RU_STAGE: ${{ steps.preflight.outputs.ru_stage }}
          SEED_SHA256: 708fb8d9a665e31854a15183328234b728cd996e276b6db1d74c887dedd28937
          OPERATION_TIMEOUT_SECONDS: ${{ inputs.operation_timeout_seconds }}
        run: |
          set -euo pipefail
          unit="pork-production-fresh-install-${RELEASE_SHA:0:12}"
          runner_sha="$(sha256sum deploy/product_api/fresh_install_runner.sh | cut -d' ' -f1)"
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/fresh-install-ssh/known_hosts")
          credential="/etc/pork/fresh-install-credentials/$RELEASE_SHA.database-identity.sha256"
          ssh "${ssh_args[@]}" "$RU_TARGET" bash -s -- "$unit" "$RU_STAGE" "$runner_sha" "$RELEASE_SHA" "$SEED_SHA256" "$OPERATION_TIMEOUT_SECONDS" "$credential" <<'REMOTE'
          set -euo pipefail
          unit=$1; stage=$2; runner_sha=$3; release_sha=$4; seed_sha256=$5; operation_timeout=$6; credential=$7
          test "$(stat -c '%u:%a' -- "$stage")" = 0:750
          test "$(sha256sum "$stage/fresh_install_runner.sh" | cut -d' ' -f1)" = "$runner_sha"
          test -f "$credential" && test ! -L "$credential" && test "$(stat -c '%u:%g:%a' -- "$credential")" = 0:0:600
          cd "$stage"
          sha256sum --strict --check "fresh-install-tools-$release_sha.sha256"
          for file in *; do test -f "$file" && test ! -L "$file"; chmod 640 "$file"; sync -f "$file"; done
          chmod 750 fresh_install_runner.sh fresh_install_boot_guard.sh
          unit_path="/etc/systemd/system/$unit.service"
          temporary="/etc/systemd/system/.$unit.$$.tmp"
          test ! -e "$temporary" && test ! -L "$temporary"
          {
            printf '%s\n' '[Unit]' 'Description=One-time destructive exact-SHA production fresh install' 'After=docker.service network-online.target' 'Wants=docker.service network-online.target' 'StartLimitIntervalSec=0' '' '[Service]' 'Type=exec' 'User=root' 'Group=www-data' "WorkingDirectory=$stage" 'UMask=0027' 'Restart=on-failure' 'RestartSec=30' 'KillMode=control-group' 'KillSignal=SIGTERM' 'RuntimeMaxSec=7200' 'TimeoutStopSec=900' 'SendSIGKILL=yes' 'NoNewPrivileges=yes' 'PrivateTmp=yes' 'StandardOutput=journal' 'StandardError=journal'
            printf 'ExecStart=/bin/bash %s %s %s %s %s %s %s\n' "$stage/fresh_install_runner.sh" "$stage" "$release_sha" "$seed_sha256" "$unit" "$operation_timeout" "$credential"
            printf '%s\n' '' '[Install]' 'WantedBy=multi-user.target'
          } > "$temporary"
          chmod 640 "$temporary"; sync -f "$temporary"
          if test -e "$unit_path" || test -L "$unit_path"; then test -f "$unit_path" && test ! -L "$unit_path" && cmp -s "$temporary" "$unit_path"; unlink "$temporary"; else mv -T "$temporary" "$unit_path"; fi
          guard=pork-production-fresh-install-ingress-guard.service
          guard_path="/etc/systemd/system/$guard"
          guard_tmp="/etc/systemd/system/.$guard.$$.tmp"
          test ! -e "$guard_tmp" && test ! -L "$guard_tmp"
          {
            printf '%s\n' '[Unit]' 'Description=Fail-closed nginx guard for an incomplete production fresh install' 'Before=nginx.service' '' '[Service]' 'Type=oneshot' 'User=root' 'Group=root' 'UMask=0027' 'RemainAfterExit=yes' 'NoNewPrivileges=yes'
            printf 'ExecStart=/bin/bash %s %s %s\n' "$stage/fresh_install_boot_guard.sh" "$stage" "$release_sha"
            printf '%s\n' '' '[Install]' 'RequiredBy=nginx.service'
          } > "$guard_tmp"
          chmod 640 "$guard_tmp"; sync -f "$guard_tmp"
          if test -e "$guard_path" || test -L "$guard_path"; then test -f "$guard_path" && test ! -L "$guard_path" && cmp -s "$guard_tmp" "$guard_path"; unlink "$guard_tmp"; else mv -T "$guard_tmp" "$guard_path"; fi
          dropin_dir=/etc/systemd/system/nginx.service.d
          test ! -L "$dropin_dir"
          install -d -m 755 -o root -g root "$dropin_dir"
          dropin="$dropin_dir/90-pork-production-fresh-install.conf"
          dropin_tmp="$dropin_dir/.90-pork-production-fresh-install.$$.tmp"
          test ! -e "$dropin_tmp" && test ! -L "$dropin_tmp"
          printf '%s\n' '[Unit]' "Requires=$guard" "After=$guard" > "$dropin_tmp"
          chmod 644 "$dropin_tmp"; sync -f "$dropin_tmp"
          if test -e "$dropin" || test -L "$dropin"; then test -f "$dropin" && test ! -L "$dropin" && cmp -s "$dropin_tmp" "$dropin"; unlink "$dropin_tmp"; else mv -T "$dropin_tmp" "$dropin"; fi
          sync -f "$unit_path"; sync -f "$guard_path"; sync -f "$dropin"; sync -f /etc/systemd/system
          systemctl daemon-reload
          systemctl enable "$guard"
          systemctl enable --now "$unit.service"
          test "$(systemctl show --property=LoadState --value "$unit.service")" = loaded
          REMOTE
          echo "unit=$unit" >> "$GITHUB_OUTPUT"
          echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Wait for durable exact-SHA fresh-install success
        id: success
        if: steps.durable.outputs.started == 'true'
        timeout-minutes: 125
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-main.outputs.release_sha }}
          RU_TARGET: ${{ secrets.RU_DEPLOY_TARGET }}
          RU_STAGE: ${{ steps.preflight.outputs.ru_stage }}
          UNIT: ${{ steps.durable.outputs.unit }}
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/fresh-install-ssh/known_hosts")
          for attempt in $(seq 1 1440); do
            outcome=$(ssh "${ssh_args[@]}" "$RU_TARGET" bash -s -- "$RU_STAGE" "$RELEASE_SHA" "$UNIT" <<'REMOTE'
          set -euo pipefail
          stage=$1; release_sha=$2; unit=$3
          if test -f "$stage/fresh-install-success" && test ! -L "$stage/fresh-install-success"; then
            python3 - "$stage/fresh-install-success" "$release_sha" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          expected={'phase':'fresh-install-success','release_sha':sys.argv[2],'schema_version':'production_fresh_install_marker_v1'}
          raise SystemExit(0 if data == expected else 2)
          PY
            echo success
          elif systemctl is-active --quiet "$unit.service" || systemctl is-activating --quiet "$unit.service"; then
            echo running
          elif test -f "$stage/roll-forward-required"; then
            echo roll-forward-required
          else
            echo failed
          fi
          REMOTE
          )
            case "$outcome" in
              success) echo "complete=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              running) sleep 5 ;;
              roll-forward-required) echo 'fresh install stopped after DROP; maintenance remains and only exact-SHA roll-forward is allowed' >&2; exit 1 ;;
              *) echo 'durable fresh-install unit disappeared without success; STOP' >&2; exit 2 ;;
            esac
          done
          echo 'durable fresh install exceeded its bounded window; maintenance/roll-forward remains' >&2
          exit 2

      - name: Restore prior Gateway when RU durable handoff is absent
        if: always() && steps.gateway_arm.outputs.armed == 'true' && steps.success.outputs.complete != 'true'
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-main.outputs.release_sha }}
          RU_TARGET: ${{ secrets.RU_DEPLOY_TARGET }}
          RU_STAGE: ${{ steps.preflight.outputs.ru_stage }}
          US_TARGET: ${{ secrets.US_DEPLOY_TARGET }}
          US_STAGE: ${{ steps.preflight.outputs.us_stage }}
          SEED_SHA256: 708fb8d9a665e31854a15183328234b728cd996e276b6db1d74c887dedd28937
          OPERATION_TIMEOUT_SECONDS: ${{ inputs.operation_timeout_seconds }}
        run: |
          set -euo pipefail
          unit="pork-production-fresh-install-${RELEASE_SHA:0:12}"
          credential="/etc/pork/fresh-install-credentials/$RELEASE_SHA.database-identity.sha256"
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/fresh-install-ssh/known_hosts")
          restore_prior_gateway() {
            ssh "${ssh_args[@]}" "$US_TARGET" bash -s -- "$US_STAGE" "$RELEASE_SHA" <<'REMOTE'
          set -euo pipefail
          stage=$1; release_sha=$2
          cd "$stage"
          prior_payload=$(python3 fresh_install_gateway_receipt.py read "$stage/prior-gateway.json" "$release_sha")
          mapfile -t prior <<< "$prior_payload"
          test "${#prior[@]}" -eq 3
          project=${prior[0]}; old_image=${prior[1]}; prior_commit=${prior[2]}
          test "$(docker image inspect --format '{{.Id}}' "b2b-gateway-api:fresh-install-prior-$release_sha")" = "$old_image"
          commit_value=$prior_commit
          if test "$prior_commit" = -; then commit_value=; fi
          cd /opt/b2b
          GATEWAY_ENV_FILE=/opt/b2b/.env.gateway GATEWAY_IMAGE_TAG="fresh-install-prior-$release_sha" GATEWAY_RELEASE_COMMIT="$commit_value" docker compose -p "$project" -f "$stage/docker-compose.gateway.yml" --env-file .env.gateway up -d --no-build --force-recreate gateway_api >/dev/null
          id=$(GATEWAY_ENV_FILE=/opt/b2b/.env.gateway GATEWAY_IMAGE_TAG="fresh-install-prior-$release_sha" GATEWAY_RELEASE_COMMIT="$commit_value" docker compose -p "$project" -f "$stage/docker-compose.gateway.yml" --env-file .env.gateway ps -q gateway_api)
          test -n "$id"
          test "$(docker inspect --format '{{.Image}}' "$id")" = "$old_image"
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$id")" = "$project"
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$id" | grep -Fx "GATEWAY_RELEASE_COMMIT=$commit_value" >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8001/health >/dev/null
          REMOTE
          }
          handoff=$(ssh "${ssh_args[@]}" "$RU_TARGET" bash -s -- "$unit" "$RU_STAGE" "$RELEASE_SHA" "$SEED_SHA256" "$OPERATION_TIMEOUT_SECONDS" "$credential" <<'REMOTE'
          set -euo pipefail
          unit=$1; stage=$2; release_sha=$3; seed_sha256=$4; operation_timeout=$5; credential=$6
          state_root=/var/lib/pork/deploy-state
          validate_global_receipt() {
            local path=$1 phase=$2
            test -f "$path" && test ! -L "$path"
            python3 - "$path" "$phase" "$release_sha" "$stage" <<'PY'
          import json, sys
          path, phase, release_sha, stage = sys.argv[1:]
          raw = open(path, encoding='utf-8', newline='').read()
          expected = {'phase': phase, 'release_sha': release_sha, 'schema_version': 'production_fresh_install_global_v1', 'stage': stage}
          if json.loads(raw) != expected or raw != json.dumps(expected, separators=(',', ':'), sort_keys=True) + '\n':
              raise SystemExit('fresh-install durable handoff receipt mismatch; STOP')
          PY
          }
          for phase in success active; do
            receipt="$state_root/fresh-install-$phase.json"
            if test -e "$receipt" || test -L "$receipt"; then
              validate_global_receipt "$receipt" "$phase"
              echo durable
              exit 0
            fi
          done
          unit_path="/etc/systemd/system/$unit.service"
          if test -e "$unit_path" || test -L "$unit_path"; then
            test -f "$unit_path" && test ! -L "$unit_path"
            grep -Fqx "ExecStart=/bin/bash $stage/fresh_install_runner.sh $stage $release_sha $seed_sha256 $unit $operation_timeout $credential" "$unit_path"
            active_state=$(systemctl show --property=ActiveState --value "$unit.service")
            if enabled_state=$(systemctl is-enabled "$unit.service" 2>/dev/null); then
              enabled_status=0
            else
              enabled_status=$?
            fi
            case "$active_state" in
              active|activating|deactivating|reloading)
                echo durable
                exit 0
                ;;
              inactive|failed) ;;
              *) echo "unknown fresh-install recovery state: $active_state; STOP" >&2; exit 2 ;;
            esac
            case "$enabled_state" in
              enabled|enabled-runtime|linked|linked-runtime|alias)
                echo durable
                exit 0
                ;;
              disabled|masked|static|indirect|not-found) ;;
              *) echo "unknown fresh-install recovery enablement: $enabled_state/$enabled_status; STOP" >&2; exit 2 ;;
            esac
          fi
          for phase in schema-reset-armed schema-reset-complete migration-complete ingress-armed roll-forward-required fresh-install-success; do
            marker="$stage/$phase"
            if test -e "$marker" || test -L "$marker"; then
              test -f "$marker" && test ! -L "$marker"
              python3 - "$marker" "$phase" "$release_sha" <<'PY'
          import json, sys
          path, phase, release_sha = sys.argv[1:]
          raw = open(path, encoding='utf-8', newline='').read()
          expected = {'phase': phase, 'release_sha': release_sha, 'schema_version': 'production_fresh_install_marker_v1'}
          if json.loads(raw) != expected or raw != json.dumps(expected, separators=(',', ':'), sort_keys=True) + '\n':
              raise SystemExit('fresh-install durable stage marker mismatch; STOP')
          PY
              echo durable
              exit 0
            fi
          done
          echo pre-boundary
          REMOTE
          )
          case "$handoff" in
            durable)
              echo 'RU durable handoff exists; exact Gateway rollback is forbidden'
              ;;
            pre-boundary)
              restore_prior_gateway
              ;;
            *)
              echo 'RU durable handoff probe returned an invalid state; STOP' >&2
              exit 2
              ;;
          esac

      - name: Stop local deployment credential agent
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SSH_AGENT_PID:-}"
          ssh-agent -k >/dev/null

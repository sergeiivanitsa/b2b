name: One-time destructive production fresh install

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact lowercase commit already in protected main history
        required: true
        type: string
      confirm_database_schema_reset:
        description: Must equal DROP-AND-RECREATE-PRODUCTION-PUBLIC-SCHEMA
        required: true
        type: string
      operation_timeout_seconds:
        description: Per-operation bound between 30 and 900 seconds
        required: true
        default: "300"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  trusted-main:
    runs-on: ubuntu-24.04
    outputs:
      release_sha: ${{ steps.guard.outputs.release_sha }}
    steps:
      - name: Check out current protected main with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Prove trusted workflow and exact main-history SHA
        id: guard
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          SEED_RUN_ID: "33253311395"
          SEED_SHA256: 708fb8d9a665e31854a15183328234b728cd996e276b6db1d74c887dedd28937
          OPERATION_TIMEOUT_SECONDS: ${{ inputs.operation_timeout_seconds }}
          ACTUAL_REPOSITORY: ${{ github.repository }}
          PROTECTED_REPOSITORY: ${{ vars.PROTECTED_REPOSITORY }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test -n "$PROTECTED_REPOSITORY"
          test "$ACTUAL_REPOSITORY" = "$PROTECTED_REPOSITORY"
          test "$WORKFLOW_REF" = "$ACTUAL_REPOSITORY/.github/workflows/deploy_prod_fresh_install.yml@refs/heads/main"
          protected_main="$(git rev-parse HEAD)"
          test "$WORKFLOW_SHA" = "$protected_main"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SEED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SEED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OPERATION_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]]
          test "$OPERATION_TIMEOUT_SECONDS" -ge 30
          test "$OPERATION_TIMEOUT_SECONDS" -le 900
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" "$protected_main"
          test "$(git rev-parse "$WORKFLOW_SHA:.github/workflows/deploy_prod_fresh_install.yml")" = "$(git rev-parse "$protected_main:.github/workflows/deploy_prod_fresh_install.yml")"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  qa:
    name: qa-required dependency
    needs: trusted-main
    uses: ./.github/workflows/qa.yml
    with:
      release_sha: ${{ needs.trusted-main.outputs.release_sha }}

  fresh-install:
    name: exact-SHA protected destructive fresh install
    needs: [trusted-main, qa]
    if: needs.qa.outputs.verified_release_sha == needs.trusted-main.outputs.release_sha
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check out exact QA release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.trusted-main.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up locked Python
        uses: ./.github/actions/setup-python-ci
        with:
          release-sha: ${{ needs.trusted-main.outputs.release_sha }}
      - name: Download sole build-once QA release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.qa.outputs.release_artifact_name }}
          path: .release/deploy
      - name: Download canonical QA attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.qa.outputs.attestation_artifact_name }}
          path: .release/deploy-attestation
      - name: Download reviewed three-release H2 seed bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: company-public-h2-seed-bundle-e7478a2fba9aaca17829c3d99e89e8d83d4b3188
          path: .release/seed
          run-id: 33253311395
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Reverify exact QA, manifest, attestation and seed graphs
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-main.outputs.release_sha }}
          VERIFIED_RELEASE_SHA: ${{ needs.qa.outputs.verified_release_sha }}
          SEED_SHA256: 708fb8d9a665e31854a15183328234b728cd996e276b6db1d74c887dedd28937
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$VERIFIED_RELEASE_SHA" = "$RELEASE_SHA"
          cd .release/deploy
          sha256sum --check "checksums-$RELEASE_SHA.txt"
          cd ../..
          python deploy/product_api/release_manifest.py "$PWD/.release/deploy" "$RELEASE_SHA"
          python - <<'PY'
          import json, os
          from hashlib import sha256
          from pathlib import Path
          release_sha = os.environ["RELEASE_SHA"]
          release_path = Path(".release/deploy") / f"release-manifest-{release_sha}.json"
          attestation_path = Path(".release/deploy-attestation") / f"qa-attestation-{release_sha}.json"
          release = json.loads(release_path.read_text(encoding="utf-8"))
          raw = attestation_path.read_bytes()
          attestation = json.loads(raw.decode("utf-8"))
          if raw != (json.dumps(attestation, separators=(",", ":"), sort_keys=True) + "\n").encode():
              raise SystemExit("QA attestation is not canonical; STOP")
          if release.get("release_sha") != release_sha or attestation.get("verified_release_sha") != release_sha:
              raise SystemExit("release/attestation SHA mismatch; STOP")
          if attestation.get("release_artifact_name") != f"qa-release-{release_sha}":
              raise SystemExit("QA artifact identity mismatch; STOP")
          if attestation.get("release_manifest_sha256") != sha256(release_path.read_bytes()).hexdigest():
              raise SystemExit("QA release manifest digest mismatch; STOP")
          jobs = attestation.get("job_conclusions")
          required = {"UNIT_RESULT", "POSTGRES_RESULT", "WEB_RESULT", "BUILD_RESULT", "BROWSER_RESULT", "CONTRACT_RESULT"}
          if not isinstance(jobs, dict) or set(jobs) != required or set(jobs.values()) != {"success"}:
              raise SystemExit("QA attestation is not wholly successful; STOP")
          PY
          seed=.release/seed/company-public-h2-seed-bundle-e7478a2fba9aaca17829c3d99e89e8d83d4b3188.tgz
          test "$(sha256sum "$seed" | cut -d' ' -f1)" = "$SEED_SHA256"
          python - "$seed" <<'PY'
          from pathlib import Path, PurePosixPath
          import sys
          import tarfile

          archive = Path(sys.argv[1])
          with tarfile.open(archive, mode="r:gz") as handle:
              members = handle.getmembers()
          if not members or len(members) > 10_000:
              raise SystemExit("seed archive member count is invalid; STOP")
          if sum(item.size for item in members if item.isfile()) > 256 * 1024 * 1024:
              raise SystemExit("seed archive expands beyond the approved bound; STOP")
          for item in members:
              path = PurePosixPath(item.name)
              parts = path.parts
              if (
                  path.is_absolute()
                  or not parts
                  or parts[0] != "seed-bundle"
                  or any(part in {"", ".", ".."} for part in parts)
                  or not (item.isfile() or item.isdir())
              ):
                  raise SystemExit("seed archive contains an unsafe member; STOP")
          PY
          mkdir -m 750 .release/seed/extracted
          tar -xzf "$seed" --no-same-owner --no-same-permissions -C .release/seed/extracted
          python deploy/nginx/company_public_h2_seed.py verify-bundle .release/seed/extracted/seed-bundle/seed-inventory.json >/dev/null

      - name: Configure strict RU and US SSH identities
        shell: bash
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          RU_SSH_KNOWN_HOSTS: ${{ secrets.RU_SSH_KNOWN_HOSTS }}
          US_SSH_KNOWN_HOSTS: ${{ secrets.US_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PROD_SSH_KEY"
          test -n "$RU_SSH_KNOWN_HOSTS"
          test -n "$US_SSH_KNOWN_HOSTS"
          install -m 700 -d "$RUNNER_TEMP/fresh-install-ssh"
          printf '%s\n%s\n' "$RU_SSH_KNOWN_HOSTS" "$US_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/fresh-install-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/fresh-install-ssh/known_hosts"
          eval "$(ssh-agent -s)"
          printf '%s\n' "$PROD_SSH_KEY" | ssh-add - >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Validate exact destructive confirmation and protected database expectations
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-main.outputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirm_database_schema_reset }}
          DATABASE_IDENTITY_SHA256: ${{ secrets.RU_DATABASE_IDENTITY_SHA256 }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = DROP-AND-RECREATE-PRODUCTION-PUBLIC-SCHEMA
          [[ "$DATABASE_IDENTITY_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Exact read-only live RU legacy topology and database preflight
        id: preflight
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.trusted-main.outputs.release_sha }}
          RU_TARGET: ${{ secrets.RU_DEPLOY_TARGET }}
          US_TARGET: ${{ secrets.US_DEPLOY_TARGET }}
          RU_RELEASE_ROOT: ${{ vars.RU_RELEASE_ROOT }}
          US_RELEASE_ROOT: ${{ vars.US_RELEASE_ROOT }}
          DATABASE_IDENTITY_SHA256: ${{ secrets.RU_DATABASE_IDENTITY_SHA256 }}
          OPERATION_TIMEOUT_SECONDS: ${{ inputs.operation_timeout_seconds }}
        run: |
          set -euo pipefail
          [[ "$RU_TARGET" =~ ^[A-Za-z0-9._-]+@[A-Za-z0-9.-]+$ ]]
          [[ "$US_TARGET" =~ ^[A-Za-z0-9._-]+@[A-Za-z0-9.-]+$ ]]
          [[ "$RU_RELEASE_ROOT" =~ ^/[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9][A-Za-z0-9._-]*){2,}$ ]]
          [[ "$US_RELEASE_ROOT" =~ ^/[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9][A-Za-z0-9._-]*){2,}$ ]]
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/fresh-install-ssh/known_hosts")
          mkdir -m 750 -p .release/preflight
          ssh "${ssh_args[@]}" "$RU_TARGET" bash -s -- "$RU_RELEASE_ROOT/$RELEASE_SHA-fresh-install" "$RELEASE_SHA" "$OPERATION_TIMEOUT_SECONDS" <<'REMOTE'
          set -euo pipefail
          stage=$1; release_sha=$2; operation_timeout=$3
          unit_base="pork-production-fresh-install-${release_sha:0:12}"
          intended="$unit_base.service"
          guard=pork-production-fresh-install-ingress-guard.service
          seed_sha256=708fb8d9a665e31854a15183328234b728cd996e276b6db1d74c887dedd28937
          credential="/etc/pork/fresh-install-credentials/$release_sha.database-identity.sha256"
          if test -e "$stage" || test -L "$stage"; then
            test -d "$stage" && test ! -L "$stage"
            test "$(cat "$stage/stage-identity")" = "$release_sha:production-fresh-install-v1"
          fi
          test ! -e /var/lib/pork/deploy-state/fresh-install-active.json && test ! -L /var/lib/pork/deploy-state/fresh-install-active.json
          test ! -e /var/lib/pork/deploy-state/fresh-install-success.json && test ! -L /var/lib/pork/deploy-state/fresh-install-success.json
          for unit_path in /etc/systemd/system/pork-production-fresh-install-*.service; do
            test -e "$unit_path" || test -L "$unit_path" || continue
            test -f "$unit_path" && test ! -L "$unit_path"
            unit=${unit_path##*/}
            case "$unit" in
              "$intended") grep -Fqx "ExecStart=/bin/bash $stage/fresh_install_runner.sh $stage $release_sha $seed_sha256 $unit_base $operation_timeout $credential" "$unit_path" ;;
              "$guard") grep -Fqx "ExecStart=/bin/bash $stage/fresh_install_boot_guard.sh $stage $release_sha" "$unit_path" ;;
              *) echo 'incompatible production fresh-install recovery unit is installed; STOP' >&2; exit 2 ;;
            esac
            state=$(systemctl is-active "$unit" || true)
            case "$state" in active|activating|reloading|deactivating) exit 2 ;; inactive|failed|unknown) ;; *) exit 2 ;; esac
          done
          for legacy_path in /etc/systemd/system/pork-legacy-0015-bootstrap-*.service; do
            test -e "$legacy_path" || test -L "$legacy_path" || continue
            echo 'an incompatible legacy bootstrap recovery unit is installed; STOP' >&2
            exit 2
          done
          dropin=/etc/systemd/system/nginx.service.d/90-pork-production-fresh-install.conf
          if test -e "$dropin" || test -L "$dropin"; then
            test -f "$dropin" && test ! -L "$dropin"
            grep -Fqx "Requires=$guard" "$dropin"
            grep -Fqx "After=$guard" "$dropin"
            test -f "/etc/systemd/system/$guard"
          fi
          REMOTE
          ssh "${ssh_args[@]}" "$US_TARGET" "set -euo pipefail; stage='$US_RELEASE_ROOT/$RELEASE_SHA-fresh-install'; if test -e \"\$stage\" || test -L \"\$stage\"; then test -d \"\$stage\" && test ! -L \"\$stage\" && test \"\$(cat \"\$stage/stage-identity\")\" = '$RELEASE_SHA:production-fresh-install-v1'; fi"
          ssh "${ssh_args[@]}" "$RU_TARGET" 'set -euo pipefail
            stop() { echo "$1; STOP" >&2; exit 2; }
            test "$(id -u)" -eq 0
            for tool in docker python3 curl sha256sum getent nginx systemctl flock timeout find chmod sync; do command -v "$tool" >/dev/null; done
            test -f /opt/b2b/.env.product && test ! -L /opt/b2b/.env.product
            test -f /opt/b2b/docker-compose.product.yml && test ! -L /opt/b2b/docker-compose.product.yml
            test -f /etc/nginx/sites-available/pork.su.conf && test ! -L /etc/nginx/sites-available/pork.su.conf
            test -f /opt/b2b/services/web_ui/dist/index.html
            test ! -e /var/lib/pork/company-public-h2 && test ! -L /var/lib/pork/company-public-h2
            test ! -e /var/lib/pork/web-ui && test ! -L /var/lib/pork/web-ui
            product_id=$(docker compose -f /opt/b2b/docker-compose.product.yml --env-file /opt/b2b/.env.product ps -q product_api)
            report_id=$(docker compose -f /opt/b2b/docker-compose.product.yml --env-file /opt/b2b/.env.product ps -q company_report_worker)
            test -n "$product_id" && test -n "$report_id"
            test "$(docker inspect --format "{{.State.Running}}" "$product_id")" = true
            test "$(docker inspect --format "{{.State.Running}}" "$report_id")" = true
            image=$(docker inspect --format "{{.Image}}" "$product_id")
            test "$(docker inspect --format "{{.Image}}" "$report_id")" = "$image"
            test "$image" = sha256:f99665e9c0654cfca050a2f4d8d05a05f70b1ce94534e15c8c55bd23c65e74ad || stop "legacy Product image digest changed"
            legacy_config_image=b2b-product-api:6bee95e881a3e9ea1fe324ca13c11ae239f896f4
            test "$(docker inspect --format "{{.Config.Image}}" "$product_id")" = "$legacy_config_image" || stop "legacy Product config image changed"
            test "$(docker inspect --format "{{.Config.Image}}" "$report_id")" = "$legacy_config_image" || stop "legacy report worker config image changed"
            product_env=$(docker inspect --format "{{range .Config.Env}}{{println .}}{{end}}" "$product_id")
            report_env=$(docker inspect --format "{{range .Config.Env}}{{println .}}{{end}}" "$report_id")
            product_release_count=$(printf "%s\n" "$product_env" | sed -n "/^PRODUCT_RELEASE_COMMIT=/p" | wc -l)
            report_release_count=$(printf "%s\n" "$report_env" | sed -n "/^PRODUCT_RELEASE_COMMIT=/p" | wc -l)
            test "$product_release_count" -eq 0 || stop "legacy Product unexpectedly exposes PRODUCT_RELEASE_COMMIT"
            test "$report_release_count" -eq 0 || stop "legacy report worker unexpectedly exposes PRODUCT_RELEASE_COMMIT"
            project=$(docker inspect --format "{{index .Config.Labels \"com.docker.compose.project\"}}" "$product_id")
            test "$(docker inspect --format "{{index .Config.Labels \"com.docker.compose.project\"}}" "$report_id")" = "$project"
            printf "%s\n" "$project" | grep -Eq "^[a-z0-9][a-z0-9_-]*$"
            test "$(docker port "$product_id" 8000/tcp)" = 127.0.0.1:8000
            test "$(docker ps -q --filter label=com.docker.compose.service=product_api | wc -l)" -eq 1
            test "$(docker ps -q --filter label=com.docker.compose.service=company_report_worker | wc -l)" -eq 1
            test "$(docker ps -q --filter label=com.docker.compose.service=company_card_narrative_worker | wc -l)" -eq 0
            revision=$(docker exec -w /app/services/product_api "$product_id" python -m alembic -c alembic.ini current)
            case "$revision" in 0015_claims_company_report_handoff|"0015_claims_company_report_handoff (head)") ;; *) stop "legacy Product Alembic revision changed" ;; esac
            test "$(docker inspect --format "{{range .Mounts}}{{if eq .Destination \"/data/claims_uploads\"}}{{println .Destination}}{{end}}{{end}}" "$product_id")" = ""
            test -d /var/lib/pork && test ! -L /var/lib/pork
            test "$(realpath -e -- /var/lib/pork)" = /var/lib/pork
            test "$(stat -c "%u" -- /var/lib/pork)" = 0
            claims_parent=/var/lib/pork/claims-uploads
            claims_root=$claims_parent/v1
            test -d "$claims_parent" && test ! -L "$claims_parent" || stop "legacy Claims parent is not a real directory"
            test "$(realpath -e -- "$claims_parent")" = "$claims_parent" || stop "legacy Claims parent is not canonical"
            case "$(stat -c "%u:%g:%a" -- "$claims_parent")" in 0:0:755|0:0:750) ;; *) stop "legacy Claims parent identity or mode changed" ;; esac
            test -d "$claims_root" && test ! -L "$claims_root" || stop "legacy Claims root is not a real directory"
            test "$(realpath -e -- "$claims_root")" = "$claims_root" || stop "legacy Claims root is not canonical"
            case "$(stat -c "%u:%g:%a" -- "$claims_root")" in 0:0:700|0:0:750) ;; *) stop "legacy Claims root identity or mode changed" ;; esac
            unexpected_claims_entry=$(find "$claims_parent" -mindepth 1 -maxdepth 1 ! -path "$claims_root" -print -quit)
            first_claims_entry=$(find "$claims_root" -mindepth 1 -print -quit)
            test -z "$unexpected_claims_entry" || stop "legacy Claims parent contains an unexpected entry"
            test -z "$first_claims_entry" || stop "legacy Claims root is not empty"
            python3 - /opt/b2b/.env.product <<"PY"
          import pathlib, sys
          rows={}
          for raw in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              if not raw or raw.lstrip().startswith("#") or "=" not in raw: continue
              key, value = raw.split("=", 1)
              rows[key] = value
          if rows.get("CLAIMS_UPLOAD_ROOT") != "/var/lib/pork/claims-uploads/v1" or rows.get("CLAIMS_UPLOAD_DIR") != "/data/claims_uploads":
              raise SystemExit("persistent Claims upload mapping is not configured; STOP")
          superadmin = rows.get("SUPERADMIN_EMAIL", "")
          if not superadmin or superadmin != superadmin.strip() or len(superadmin) > 320:
              raise SystemExit("initial superadmin setting is invalid; STOP")
          PY
            printf "%s\n%s\n%s\n" "$product_id" "$report_id" "$project"' > .release/preflight/ru-topology.txt
          mapfile -t ru < .release/preflight/ru-topology.txt
          test "${#ru[@]}" -eq 3
          product_id=${ru[0]}
          provider=$(ssh "${ssh_args[@]}" "$RU_TARGET" "docker exec -i '$product_id' python - provider --release-sha '$RELEASE_SHA'" < deploy/product_api/fresh_install_candidate.py)
          test "$provider" = enabled -o "$provider" = disabled
          ssh "${ssh_args[@]}" "$RU_TARGET" "docker exec -i '$product_id' python - legacy-claims --release-sha '$RELEASE_SHA'" < deploy/product_api/fresh_install_candidate.py
          printf '%s\n' "$provider" >> .release/preflight/ru-topology.txt
          ssh "${ssh_args[@]}" "$RU_TARGET" "docker exec -i -e EXPECTED_DATABASE_IDENTITY_SHA256='$DATABASE_IDENTITY_SHA256' '$product_id' python - inspect --release-sha '$RELEASE_SHA'" < deploy/product_api/fresh_install_database.py > .release/preflight/database-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.release/preflight/database-preflight.json')
          raw = path.read_text(encoding='utf-8')
          data = json.loads(raw)
          if raw != json.dumps(data, separators=(',', ':'), sort_keys=True) + '\n' or data.get('phase') != 'preflight':
              raise SystemExit('database preflight receipt is not canonical; STOP')
          PY
          ssh "${ssh_args[@]}" "$US_TARGET" 'set -euo pipefail
            stop() { echo "$1; STOP" >&2; exit 2; }
            test "$(id -u)" -eq 0
            command -v docker >/dev/null && command -v curl >/dev/null && command -v python3 >/dev/null
            test -f /opt/b2b/.env.gateway && test ! -L /opt/b2b/.env.gateway
            test -f /opt/b2b/docker-compose.gateway.yml && test ! -L /opt/b2b/docker-compose.gateway.yml
            gateway_ids=$(docker ps -aq --filter label=com.docker.compose.service=gateway_api)
            mapfile -t ids < <(printf "%s" "$gateway_ids")
            test "${#ids[@]}" -eq 1 || stop "legacy Gateway container cardinality changed"
            id=${ids[0]}
            test "$(docker inspect --format "{{.State.Running}}" "$id")" = true || stop "legacy Gateway is not running"
            test "$(docker port "$id" 8001/tcp)" = 127.0.0.1:8001
            test "$(docker inspect --format "{{.HostConfig.RestartPolicy.Name}}" "$id")" = unless-stopped
            project=$(docker inspect --format "{{index .Config.Labels \"com.docker.compose.project\"}}" "$id")
            image=$(docker inspect --format "{{.Image}}" "$id")
            config_image=$(docker inspect --format "{{.Config.Image}}" "$id")
            config_files=$(docker inspect --format "{{index .Config.Labels \"com.docker.compose.project.config_files\"}}" "$id")
            working_dir=$(docker inspect --format "{{index .Config.Labels \"com.docker.compose.project.working_dir\"}}" "$id")
            environment_file=$(docker inspect --format "{{index .Config.Labels \"com.docker.compose.project.environment_file\"}}" "$id")
            test "$project" = b2b || stop "Gateway Compose project changed"
            printf "%s\n" "$image" | grep -Eq "^sha256:[0-9a-f]{64}$"
            gateway_env=$(docker inspect --format "{{range .Config.Env}}{{println .}}{{end}}" "$id")
            commit_count=$(printf "%s\n" "$gateway_env" | sed -n "/^GATEWAY_RELEASE_COMMIT=/p" | wc -l)
            test "$commit_count" -le 1
            prior_commit=-
            if test "$commit_count" -eq 1; then
              commit_value=$(printf "%s\n" "$gateway_env" | sed -n "s/^GATEWAY_RELEASE_COMMIT=//p")
              if test -n "$commit_value"; then prior_commit=$commit_value; printf "%s\n" "$prior_commit" | grep -Eq "^[0-9a-f]{40}$"; fi
            fi
            printf "%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n" "$id" "$project" "$image" "$prior_commit" "$config_image" "$config_files" "$working_dir" "$environment_file" "$commit_count"' > .release/preflight/us-topology.txt
          mapfile -t us < .release/preflight/us-topology.txt
          test "${#us[@]}" -eq 9
          gateway_candidate=$(python3 -c "import json,re,sys; value=json.load(open(sys.argv[1],encoding='utf-8')); digest=value['images'][sys.argv[2]]['config_digest']; (isinstance(digest,str) and re.fullmatch(r'sha256:[0-9a-f]{64}',digest)) or sys.exit(2); print(digest)" ".release/deploy/release-manifest-$RELEASE_SHA.json" "gateway-api-$RELEASE_SHA.oci.tar")
          prior_state=$(ssh "${ssh_args[@]}" "$US_TARGET" "set -euo pipefail; receipt='$US_RELEASE_ROOT/$RELEASE_SHA-fresh-install/prior-gateway.json'; if test -e \"\$receipt\" || test -L \"\$receipt\"; then echo present; else echo absent; fi")
          case "$prior_state" in
            present)
              prior_payload=$(ssh "${ssh_args[@]}" "$US_TARGET" "python3 - read '$US_RELEASE_ROOT/$RELEASE_SHA-fresh-install/prior-gateway.json' '$RELEASE_SHA'" < deploy/product_api/fresh_install_gateway_receipt.py)
              mapfile -t prior <<< "$prior_payload"
              test "${#prior[@]}" -eq 3
              test "${us[1]}" = "${prior[0]}"
              prior_tag=$(ssh "${ssh_args[@]}" "$US_TARGET" "docker image inspect --format '{{.Id}}' 'b2b-gateway-api:fresh-install-prior-$RELEASE_SHA'")
              test "$prior_tag" = "${prior[1]}"
              if test "${us[2]}" = "${prior[1]}"; then
                test "${us[3]}" = "${prior[2]}"
                if test "${us[4]}" = b2b-gateway_api; then
                  test "${us[2]}" = sha256:f3da3267549b92c04bcec89d0f9c6502b2a5b79c3652678471d2def0b90e3035
                  test "${us[3]}" = -
                  test "${us[5]}" = /opt/b2b/docker-compose.gateway.yml
                  test "${us[6]}" = /opt/b2b
                  test "${us[7]}" = /opt/b2b/.env.gateway
                  test "${us[8]}" -eq 0
                else
                  test "${us[4]}" = "b2b-gateway-api:fresh-install-prior-$RELEASE_SHA"
                  test "${us[5]}" = "$US_RELEASE_ROOT/$RELEASE_SHA-fresh-install/docker-compose.gateway.yml"
                  test "${us[6]}" = "$US_RELEASE_ROOT/$RELEASE_SHA-fresh-install"
                  test "${us[7]}" = /opt/b2b/.env.gateway
                  test "${us[8]}" -eq 1
                fi
              elif test "${us[2]}" = "$gateway_candidate"; then
                test "${us[3]}" = "$RELEASE_SHA"
                test "${us[4]}" = "b2b-gateway-api:$RELEASE_SHA"
                test "${us[5]}" = "$US_RELEASE_ROOT/$RELEASE_SHA-fresh-install/docker-compose.gateway.yml"
                test "${us[6]}" = "$US_RELEASE_ROOT/$RELEASE_SHA-fresh-install"
                test "${us[7]}" = /opt/b2b/.env.gateway
                test "${us[8]}" -eq 1
              else
                echo 'current Gateway is outside the immutable prior/candidate graph; STOP' >&2
                exit 2

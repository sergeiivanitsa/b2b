# One-time revision-0015 maintenance bridge.  It exposes only immutable H2
# assets and the candidate Web pointer while every Product-backed route is
# fail-closed.  The regular production config replaces it only after Product
# and Web have passed their bootstrap checks.
server {
    listen 80;
    server_name pork.su www.pork.su;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pork.su www.pork.su;

    ssl_certificate     /etc/letsencrypt/live/pork.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pork.su/privkey.pem;
    client_max_body_size 12m;

    # Before the first pointer exists, public Web requests return maintenance
    # 503.  Once the installer atomically creates it, its public smoke sees the
    # exact candidate while Product ingress remains closed.
    root /var/lib/pork/web-ui/v1/current/site;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location ^~ /api/docs { return 404; }
    location ^~ /api/redoc { return 404; }
    location = /api/openapi.json { return 404; }

    location ^~ /api/ {
        add_header Retry-After "300" always;
        return 503;
    }

    # Revision 0015 server documents can enqueue or observe report work, so
    # they stay behind the same maintenance boundary as the API.
    location ~ "^/company/(?:[0-9]{10}|[0-9]{12})-[a-z0-9]+(?:-[a-z0-9]+)*$" {
        add_header Retry-After "300" always;
        return 503;
    }

    # Sole intentional delta from the exact legacy config.
    location ^~ /assets/company-public-h2. {
        root /var/lib/pork/company-public-h2/v1;
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /robots.txt {
        add_header Retry-After "300" always;
        return 503;
    }

    location = /sitemaps/index.xml {
        add_header Retry-After "300" always;
        return 503;
    }

    location ~ ^/sitemaps/[1-9][0-9]*\.xml$ {
        add_header Retry-After "300" always;
        return 503;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html =503;
        add_header Retry-After "300" always;
        add_header Cache-Control "no-store";
    }
}

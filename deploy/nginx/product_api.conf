server {
    listen 80;
    server_name pork.su www.pork.su;

    # Let's Encrypt challenge (если понадобится обновлять сертификат)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pork.su www.pork.su;

    ssl_certificate     /etc/letsencrypt/live/pork.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pork.su/privkey.pem;
    client_max_body_size 12m;

    # SPA (Vite build)
    root /opt/b2b/services/web_ui/dist;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Закрываем API docs/openapi
    location ^~ /api/docs { return 404; }
    location ^~ /api/redoc { return 404; }
    location = /api/openapi.json { return 404; }

    # SSE: потоковый чат
    location ^~ /api/v1/chat {
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;

        gzip off;
        proxy_set_header Accept-Encoding "";
        add_header Cache-Control "no-cache";
    }

    # Остальной API
    location ^~ /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        send_timeout 300s;

        add_header Cache-Control "no-store";
    }

    # The plain resolver is the only route allowed to fall back to H1 SPA.
    location ~ "^/company/(?:[0-9]{10}|[0-9]{12})$" {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 = @company_h1_spa;
    }

    # Canonical H1/H2 documents never fall back: their status is meaningful.
    location ~ "^/company/(?:[0-9]{10}|[0-9]{12})-[a-z0-9]+(?:-[a-z0-9]+)*$" {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    }

    location @company_h1_spa {
        internal;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    location ^~ /assets/company-public-h2. {
        # `root`, rather than `alias`, preserves the request URI.  Thus
        # /assets/company-public-h2.<hash>.js resolves below the immutable
        # release root exactly once.
        root /var/lib/pork/company-public-h2/v1;
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8000/robots.txt;
        proxy_set_header Host $host;
    }

    location = /sitemaps/index.xml {
        proxy_pass http://127.0.0.1:8000/sitemaps/index.xml;
        proxy_set_header Host $host;
    }

    location ~ ^/sitemaps/[1-9][0-9]*\.xml$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Кэш для ассетов (если файл существует)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA fallback для роутов /login /chat /auth/confirm и т.п.
    # SPA fallback also serves claims routes: /claims/* and /admin/*.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
